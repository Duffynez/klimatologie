<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1210" viewBox="0 0 760 1210" role="img" aria-labelledby="title desc">
<title id="title">Postup kontroly a párové homogenizace měsíčních teplot</title>
<desc id="desc">Z původního archivu se nejprve označí podezřelé údaje. Použitelné měsíce se porovnají mezi stanicemi. Z opakovaných změn rozdílů se určí stanice a období posunu. Odhadnuté úpravy vytvoří samostatnou homogenizovanou verzi, původní archiv zůstává zachován.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#216d73"/></marker></defs>
<rect width="760" height="1210" fill="#f5f6f0"/>
<g font-family="Arial,sans-serif" fill="#173b3e" text-anchor="middle">
<text x="380" y="53" font-size="32" font-weight="bold">Dvě navazující úlohy</text>
<rect x="35" y="86" width="690" height="142" rx="9" fill="#fff" stroke="#8babab" stroke-width="2"/>
<text x="380" y="128" font-size="29" font-weight="bold">Archiv měření a historie stanic</text>
<text x="380" y="168" font-size="26">Teplota, měsíc, místo a původ údaje</text>
<text x="380" y="204" font-size="26">Záznamy o přístroji a změnách stanoviště</text>
<path d="M380 235V282" stroke="#216d73" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="35" y="294" width="690" height="146" rx="9" fill="#fff" stroke="#bd6047" stroke-width="3"/>
<text x="380" y="338" font-size="29" font-weight="bold">1. Kontrola jednotlivých údajů</text>
<text x="380" y="377" font-size="26">Podezřelé hodnoty dostanou příznak</text>
<text x="380" y="413" font-size="26">Pro další výpočet vybereme použitelné údaje</text>
<path d="M380 447V494" stroke="#216d73" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="35" y="506" width="690" height="146" rx="9" fill="#fff" stroke="#216d73" stroke-width="3"/>
<text x="380" y="550" font-size="29" font-weight="bold">2. Porovnání dvojic stanic</text>
<text x="380" y="589" font-size="26">Odečteme průběhy jejich teplotních odchylek</text>
<text x="380" y="625" font-size="26">Společné kolísání se v rozdílu oslabí</text>
<path d="M380 659V706" stroke="#216d73" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="35" y="718" width="690" height="146" rx="9" fill="#fff" stroke="#216d73" stroke-width="3"/>
<text x="380" y="762" font-size="29" font-weight="bold">3. Určení místního posunu</text>
<text x="380" y="801" font-size="26">Spojíme nálezy z více dvojic</text>
<text x="380" y="837" font-size="26">Určíme stanici, dobu a velikost změny</text>
<path d="M380 871V918" stroke="#216d73" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="35" y="930" width="690" height="146" rx="9" fill="#e7f1ee" stroke="#216d73" stroke-width="3"/>
<text x="380" y="974" font-size="29" font-weight="bold">4. Homogenizovaná verze</text>
<text x="380" y="1013" font-size="26">Úseky přepočítáme na společné podmínky</text>
<text x="380" y="1049" font-size="26">Zachováme údaje o provedených úpravách</text>
<text x="380" y="1134" font-size="25">Původní archiv zůstává dostupný</text>
<text x="380" y="1170" font-size="25">vedle výsledku zpracování.</text>
</g></svg>