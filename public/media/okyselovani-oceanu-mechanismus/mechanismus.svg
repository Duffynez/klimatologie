<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc"><title id="title">Jak přísun CO₂ mění povrchovou vodu</title><desc id="desc">Kvalitativní schéma výměny přes hladinu, růstu vodíkových iontů a úbytku uhličitanů. Kontrolní varianta zachovává obsah CO₂ ve vzduchu. Místní odezvu ovlivňují teplota, promíchávání a biologie.</desc><rect width="1100" height="690" fill="#f7f7f1"/><g font-family="Arial, sans-serif"><defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#346f91"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#a6572c"/></marker></defs><text x="36" y="48" font-size="31" fill="#213530" font-weight="700" text-anchor="start">Jak přísun CO₂ mění povrchovou vodu</text><text x="36" y="82" font-size="20" fill="#213530" font-weight="400" text-anchor="start">Stejná teplota, slanost a alkalinita v kontrolním srovnání</text><rect x="36" y="112" width="650" height="112" rx="12" fill="#e4eef4" stroke="none"/><text x="61" y="145" font-size="16" fill="#346f91" font-weight="700" text-anchor="start">VZDUCH</text><text x="61" y="188" font-size="28" fill="#254f68" font-weight="700" text-anchor="start">Rostoucí obsah CO₂</text><rect x="36" y="274" width="650" height="320" rx="12" fill="#e3efed" stroke="none"/><line x1="493" y1="194" x2="493" y2="321" stroke="#346f91" stroke-width="6" marker-end="url(#blue)"/><line x1="544" y1="318" x2="544" y2="210" stroke="#346f91" stroke-width="3" marker-end="url(#blue)"/><line x1="36" y1="250" x2="686" y2="250" stroke="#346f91" stroke-width="2" /><text x="61" y="244" font-size="18" fill="#346f91" font-weight="400" text-anchor="start">hladina</text><text x="61" y="306" font-size="16" fill="#1d5d58" font-weight="700" text-anchor="start">POVRCHOVÁ VODA</text><text x="61" y="351" font-size="27" fill="#213530" font-weight="700" text-anchor="start">Více rozpuštěného CO₂</text><line x1="95" y1="368" x2="95" y2="416" stroke="#a6572c" stroke-width="4" marker-end="url(#orange)"/><text x="61" y="454" font-size="29" fill="#934b27" font-weight="700" text-anchor="start">Více H⁺ → nižší pH</text><text x="61" y="500" font-size="22" fill="#213530" font-weight="400" text-anchor="start">Část H⁺ se váže na uhličitany:</text><text x="61" y="542" font-size="29" fill="#934b27" font-weight="700" text-anchor="start">CO₃²⁻ + H⁺ → HCO₃⁻</text><text x="61" y="577" font-size="21" fill="#213530" font-weight="400" text-anchor="start">Uhličitanů ubývá, hydrogenuhličitanů přibývá.</text><rect x="718" y="112" width="346" height="196" rx="12" fill="#fffdf6" stroke="#cccdbd"/><text x="741" y="148" font-size="16" fill="#56605b" font-weight="700" text-anchor="start">KONTROLNÍ VARIANTA</text><text x="741" y="185" font-size="22" fill="#213530" font-weight="400" text-anchor="start">CO₂ ve vzduchu se nemění.</text><text x="741" y="221" font-size="22" fill="#213530" font-weight="400" text-anchor="start">Při ostatních stejných</text><text x="741" y="253" font-size="22" fill="#213530" font-weight="400" text-anchor="start">podmínkách tento přídavný</text><text x="741" y="285" font-size="22" fill="#213530" font-weight="400" text-anchor="start">účinek nevzniká.</text><rect x="718" y="329" width="346" height="265" rx="12" fill="#eef1e5" stroke="#ccd2bc"/><text x="741" y="365" font-size="16" fill="#526543" font-weight="700" text-anchor="start">DALŠÍ PŘÍSPĚVKY</text><text x="741" y="405" font-size="22" fill="#213530" font-weight="400" text-anchor="start">Teplota mění rovnováhy</text><text x="741" y="436" font-size="22" fill="#213530" font-weight="400" text-anchor="start">a rozpustnost plynu.</text><text x="741" y="479" font-size="22" fill="#213530" font-weight="400" text-anchor="start">Promíchávání přináší</text><text x="741" y="510" font-size="22" fill="#213530" font-weight="400" text-anchor="start">vodu jiného složení.</text><text x="741" y="553" font-size="22" fill="#213530" font-weight="400" text-anchor="start">Život uhlík odebírá i vrací.</text><text x="36" y="633" font-size="19" fill="#213530" font-weight="400" text-anchor="start">Šipky přes hladinu: výměna oběma směry. Šířky šipek nejsou měřená množství.</text><text x="36" y="665" font-size="16" fill="#53615b" font-weight="400" text-anchor="start">Klimatologie.eu · vlastní schéma s pomocí AI · CC BY 4.0 · Dickson a kol. 2007, Ma a kol. 2023</text></g></svg>
