<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Očekávané a zjištěné tempo změny pH u Havaje</title><desc id="desc">Stanice ALOHA, povrch 0–30 metrů. Tři odhady trendu: předpověď z atmosféry, výpočet z uhlíku a alkalinity a optické měření. Úsečky představují jednu standardní chybu, období optického měření je kratší.</desc><rect width="1100" height="620" fill="#f7f7f1"/><g font-family="Arial, sans-serif"><text x="36" y="48" font-size="31" fill="#213530" font-weight="700" text-anchor="start">Očekávané a zjištěné tempo změny pH</text><text x="36" y="83" font-size="21" fill="#213530" font-weight="400" text-anchor="start">Stanice ALOHA u Havaje · povrchová vrstva 0–30 metrů</text><rect x="448" y="116" width="610" height="342" rx="12" fill="#ffffff" stroke="none"/><line x1="474" y1="125" x2="474" y2="450" stroke="#dce3df" stroke-width="1" /><text x="474" y="483" font-size="19" fill="#344c41" font-weight="400" text-anchor="middle">−0,025</text><line x1="586" y1="125" x2="586" y2="450" stroke="#dce3df" stroke-width="1" /><text x="586" y="483" font-size="19" fill="#344c41" font-weight="400" text-anchor="middle">−0,020</text><line x1="698" y1="125" x2="698" y2="450" stroke="#dce3df" stroke-width="1" /><text x="698" y="483" font-size="19" fill="#344c41" font-weight="400" text-anchor="middle">−0,015</text><line x1="810" y1="125" x2="810" y2="450" stroke="#dce3df" stroke-width="1" /><text x="810" y="483" font-size="19" fill="#344c41" font-weight="400" text-anchor="middle">−0,010</text><line x1="922" y1="125" x2="922" y2="450" stroke="#dce3df" stroke-width="1" /><text x="922" y="483" font-size="19" fill="#344c41" font-weight="400" text-anchor="middle">−0,005</text><line x1="1034" y1="125" x2="1034" y2="450" stroke="#677970" stroke-width="2" /><text x="1034" y="483" font-size="19" fill="#344c41" font-weight="400" text-anchor="middle">0</text><text x="36" y="158" font-size="22" fill="#93612b" font-weight="700" text-anchor="start">Očekávání z atmosférického CO₂</text><text x="36" y="189" font-size="19" fill="#4b5b53" font-weight="400" text-anchor="start">1988–2007</text><text x="36" y="218" font-size="20" fill="#93612b" font-weight="400" text-anchor="start">−0,016 ± 0,0003 pH / desetiletí</text><line x1="668.88" y1="183" x2="682.32" y2="183" stroke="#93612b" stroke-width="4" /><line x1="668.88" y1="174" x2="668.88" y2="192" stroke="#93612b" stroke-width="3" /><line x1="682.32" y1="174" x2="682.32" y2="192" stroke="#93612b" stroke-width="3" /><circle cx="675.6" cy="183" r="7" fill="#93612b"/><text x="36" y="270" font-size="22" fill="#28665f" font-weight="700" text-anchor="start">Výpočet z uhlíku a alkalinity</text><text x="36" y="301" font-size="19" fill="#4b5b53" font-weight="400" text-anchor="start">1988–2007</text><text x="36" y="330" font-size="20" fill="#28665f" font-weight="400" text-anchor="start">−0,019 ± 0,002 pH / desetiletí</text><line x1="563.6000000000001" y1="295" x2="653.2" y2="295" stroke="#28665f" stroke-width="4" /><line x1="563.6000000000001" y1="286" x2="563.6000000000001" y2="304" stroke="#28665f" stroke-width="3" /><line x1="653.2" y1="286" x2="653.2" y2="304" stroke="#28665f" stroke-width="3" /><circle cx="608.4000000000001" cy="295" r="7" fill="#28665f"/><text x="36" y="382" font-size="22" fill="#426a96" font-weight="700" text-anchor="start">Samostatné optické měření</text><text x="36" y="413" font-size="19" fill="#4b5b53" font-weight="400" text-anchor="start">1992–1998 a 2003–2007</text><text x="36" y="442" font-size="20" fill="#426a96" font-weight="400" text-anchor="start">−0,014 ± 0,002 pH / desetiletí</text><line x1="675.6" y1="407" x2="765.2" y2="407" stroke="#426a96" stroke-width="4" /><line x1="675.6" y1="398" x2="675.6" y2="416" stroke="#426a96" stroke-width="3" /><line x1="765.2" y1="398" x2="765.2" y2="416" stroke="#426a96" stroke-width="3" /><circle cx="720.4" cy="407" r="7" fill="#426a96"/><text x="755" y="520" 