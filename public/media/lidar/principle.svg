<svg xmlns="http://www.w3.org/2000/svg" width="760" height="830" viewBox="0 0 760 830" role="img" aria-labelledby="title desc">
<title id="title">Čas návratu rozlišuje vrstvy</title><desc id="desc">Dva diagramy ukazují návraty laserového světla z atmosféry a z porostu. Přístroj míří dolů, vyšší vrstvy vracejí světlo dříve.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#256e9b"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#bd6529"/></marker></defs>
<rect width="760" height="830" rx="18" fill="#f3f7f7"/>
<g font-family="Arial, sans-serif" fill="#183c48">
