<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Bilance globální hladiny moře za roky 1993 až 2018</title><desc id="desc">Rozpínání přispělo 1,19 mm za rok, přidaná voda 1,97. Součet 3,16 je v rámci nejistot slučitelný s pobřežní rekonstrukcí 3,35 a družicovým měřením 3,32 mm za rok. Všechny intervaly jsou 90procentní.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#246c76"/></marker><marker id="warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b96a3d"/></marker><marker id="land" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#657c4a"/></marker></defs>
<rect width="1100" height="650" fill="#faf8f1"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#223936"><text x="40" y="52" font-size="34" font-weight="700">Bilance globální hladiny, 1993–2018</text><text x="40" y="88" font-size="22" >Průměrná tempa změny v mm za rok. Úsečky ukazují 90% intervaly nejistoty.</text><text x="40" y="134" font-size="18" font-weight="700" fill="#246c76">PŘÍSPĚVKY A JEJICH SOUČET</text><text x="1060" y="134" font-size="19" text-anchor="end">Odhad [90% interval]</text><path d="M370 155 L370 539" fill="none" stroke="#d7ddd5"  stroke-width="1"/><text x="370" y="577" font-size="22" text-anchor="middle">0</text><path d="M486 155 L486 539" fill="none" stroke="#d7ddd5"  stroke-width="1"/><text x="486" y="577" font-size="22" text-anchor="middle">1</text><path d="M602 155 L602 539" fill="none" stroke="#d7ddd5"  stroke-width="1"/><text x="602" y="577" font-size="22" text-anchor="middle">2</text><path d="M718 155 L718 539" fill="none" stroke="#d7ddd5"  stroke-width="1"/><text x="718" y="577" font-size="22" text-anchor="middle">3</text><path d="M834 155 L834 539" fill="none" stroke="#d7ddd5"  stroke-width="1"/><text x="834" y="577" font-size="22" text-anchor="middle">4</text><text x="40" y="193" font-size="23" >Rozpínání při ohřevu</text><path d="M484.84000000000003 185 L537.04 185" fill="none" stroke="#b96a3d"  stroke-width="5"/><path d="M484.84000000000003 175 L484.84000000000003 195" fill="none" stroke="#b96a3d" stroke-width="3" /><path d="M537.04 175 L537.04 195" fill="none" stroke="#b96a3d" stroke-width="3" /><circle cx="508.03999999999996" cy="185" r="8" fill="#b96a3d"/><text x="1060" y="192" font-size="21" text-anchor="end">1,19 [0,99–1,44]</text><text x="40" y="265" font-size="23" >Přísun vody</text><path d="M559.0799999999999 257 L640.28 257" fill="none" stroke="#246c76"  stroke-width="5"/><path d="M559.0799999999999 247 L559.0799999999999 267" fill="none" stroke="#246c76" stroke-width="3" /><path d="M640.28 247 L640.28 267" fill="none" stroke="#246c76" stroke-width="3" /><circle cx="598.52" cy="257" r="8" fill="#246c76"/><text x="1060" y="264" font-size="21" text-anchor="end">1,97 [1,63–2,33]</text><text x="40" y="337" font-size="23" font-weight="700">Součet příspěvků</text><path d="M692.48 329 L784.12 329" fill="none" stroke="#223936"  stroke-width="5"/><path d="M692.48 319 L692.48 339" fill="none" stroke="#223936" stroke-width="3" /><path d="M784.12 319 L784.12 339" fill="none" stroke="#223936" stroke-width="3" /><circle cx="736.56" cy="329" r="8" fill="#223936"/><text x="1060" y="336" font-size="21" text-anchor="end">3,16 [2,78–3,57]</text><text x="40" y="446" font-size="23" >Pobřežní rekonstrukce</text><path d="M707.56 438 L813.12 438" fill="none" stroke="#223936"  stroke-width="5"/><path d="M707.56 428 L707.56 448" fill="none" stroke="#223936" stroke-width="3" /><path d="M813.12 428 L813.12 448" fill="none" stroke="#223936" stroke-width="3" /><circle cx="758.6" cy="438" r="8" fill="#223936"/><text x="1060" y="445" font-size="21" text-anchor="end">3,35 [2,91–3,82]</text><text x="40" y="518" font-size="23" >Družicové měření</text><path d="M702.9200000000001 510 L809.64 510" fill="none" stroke="#223936"  stroke-width="5"/><path d="M702.9200000000001 500 L702.9200000000001 520" fill="none" stroke="#223936" stroke-width="3" /><path d="M809.64 500 L809.64 520" fill="none" stroke="#223936" stroke-width="3" /><circle cx="755.12" cy="510" r="8" fill="#223936"/><text x="1060" y="517" font-size="21" text-anchor="end">3,32 [2,87–3,79]</text><path d="M40 376 L1060 376" fill="none" stroke="#c9cfc5" stroke-width="3" /><text x="40" y="408" font-size="18" font-weight="700">DVA ODHADY CELKOVÉHO VZESTUPU</text><text x="603" y="613" font-size="22" text-anchor="middle">mm za rok</text><text x="40" y="642" font-size="17" >Zdroj: Frederikse a kol. 2020, tabulka 1. Intervaly součtu přebírají společné nejistoty původní studie.</text></g></svg>
