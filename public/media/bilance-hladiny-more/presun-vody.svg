<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Hmotnostní příspěvek k hladině moře</title><desc id="desc">Led na pevnině a odtok přidávají oceánu vodu. Vypařování a srážky mohou vodu přesunout na souš. GRACE sleduje přesuny hmoty a radar výšku hladiny.</desc>
