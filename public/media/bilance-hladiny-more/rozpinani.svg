<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">Tepelné rozpínání mořské vody</title><desc id="desc">Dva vodní sloupce mají stejnou hmotnost a šířku. Teplejší voda má menší hustotu a vyšší hladinu. Profily určují objem, radar výšku a gravimetrie hmotnost.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#246c76"/></marker><marker id="warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b96a3d"/></marker><marker id="land" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#657c4a"/></marker></defs>
<rect width="1100" height="650" fill="#faf8f1"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#223936"><text x="40" y="52" font-size="34" font-weight="700">Stejná hmotnost, větší objem</text><text x="40" y="88" font-size="22" >Ohřev mění hustotu. Výšku a hmotnost kontrolujeme odlišnými měřeními.</text><text x="185" y="163" font-size="24" text-anchor="middle" font-weight="700">Chladnější voda</text><text x="495" y="163" font-size="24" text-anchor="middle" font-weight="700">Teplejší voda</text><path d="M85 330H285V505H85Z" fill="#c2dfe6"/><path d="M395 280H595V505H395Z" fill="#afd1dc"/><path d="M85 330 L285 330" fill="none" stroke="#246c76" stroke-width="3" /><path d="M395 280 L595 280" fill="none" stroke="#246c76" stroke-width="3" /><path d="M85 225V505H285V225 M395 225V505H595V225" fill="none" stroke="#223936" stroke-width="3"/><path d="M66 330 L623 330" fill="none" stroke="#8b9992" stroke-width="3" stroke-dasharray="8 6"/><path d="M320 330V280" fill="none" stroke="#b96a3d" stroke-width="5" marker-end="url(#warm)"/><text x="340" y="364" font-size="18" text-anchor="middle">vzestup</text><path d="M295 208H385" fill="none" stroke="#b96a3d" stroke-width="5" marker-end="url(#warm)"/><text x="340" y="192" font-size="21" text-anchor="middle" fill="#b96a3d">ohřev</text><text x="185" y="548" font-size="22" text-anchor="middle">Stejné množství vody</text><text x="495" y="548" font-size="22" text-anchor="middle">Menší hustota</text><circle cx="125" cy="365" r="8" fill="#246c76" opacity=".65"/><circle cx="185" cy="365" r="8" fill="#246c76" opacity=".65"/><circle cx="245" cy="365" r="8" fill="#246c76" opacity=".65"/><circle cx="125" cy="417" r="8" fill="#246c76" opacity=".65"/><circle cx="185" cy="417" r="8" fill="#246c76" opacity=".65"/><circle cx="245" cy="417" r="8" fill="#246c76" opacity=".65"/><circle cx="125" cy="469" r="8" fill="#246c76" opacity=".65"/><circle cx="185" cy="469" r="8" fill="#246c76" opacity=".65"/><circle cx="245" cy="469" r="8" fill="#246c76" opacity=".65"/><circle cx="435" cy="320" r="8" fill="#246c76" opacity=".65"/><circle cx="495" cy="320" r="8" fill="#246c76" opacity=".65"/><circle cx="555" cy="320" r="8" fill="#246c76" opacity=".65"/><circle cx="435" cy="388" r="8" fill="#246c76" opacity=".65"/><circle cx="495" cy="388" r="8" fill="#246c76" opacity=".65"/><circle cx="555" cy="388" r="8" fill="#246c76" opacity=".65"/><circle cx="435" cy="456" r="8" fill="#246c76" opacity=".65"/><circle cx="495" cy="456" r="8" fill="#246c76" opacity=".65"/><circle cx="555" cy="456" r="8" fill="#246c76" opacity=".65"/><g transform="translate(848 184)"><path d="M-39 -9H-14V9H-39Z M14 -9H39V9H14Z" fill="#a5bcc5" stroke="#223936" stroke-width="2"/><rect x="-13" y="-15" width="26" height="30" rx="4" fill="#ece2ca" stroke="#223936" stroke-width="2"/><text x="0" y="-29" font-size="20" text-anchor="middle">Radarový výškoměr</text></g><path d="M820 211L760 303L876 303Z" fill="#dce8e5" opacity=".8"/><path d="M713 310 L1035 310" fill="none" stroke="#246c76" stroke-width="3" /><text x="735" y="346" font-size="22" >Měří výšku hladiny</text><path d="M710 391V485" stroke="#b96a3d" stroke-width="4"/><circle cx="710" cy="400" r="6" fill="#b96a3d"/><circle cx="710" cy="430" r="6" fill="#b96a3d"/><circle cx="710" cy="460" r="6" fill="#b96a3d"/><circle cx="710" cy="482" r="6" fill="#b96a3d"/><text x="736" y="407" font-size="22" >Profily teploty a slanosti</text><text x="736" y="439" font-size="20" >Určují objemový příspěvek</text><text x="736" y="495" font-size="22" >Gravimetrie ověřuje,</text><text x="736" y="526" font-size="22" >zda přibylo také vody</text><text x="40" y="612" font-size="20" >Kvalitativní schéma. Tečky značí stejné množství vody, změna výšky je zvětšená.</text></g></svg>
