<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800" role="img" aria-labelledby="title desc">
  <title id="title">Radarový pulz a vznik srážkového odhadu</title>
  <desc id="desc">Čas návratu echa určí vzdálenost kapek. Síla echa po kalibraci a započtení vzdálenosti poskytne odrazivost, ze které zvolený vztah odhadne intenzitu deště.</desc>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#166d99"/></marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b75b22"/></marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#506570"/></marker>
  </defs>
  <rect width="760" height="800" rx="18" fill="#f3f7f8"/>
  <g font-family="Arial, sans-serif" fill="#243c48">
    <text x="32" y="49" font-size="29" font-weight="700">Pulz, kapky a vracející se echo</text>
    <path d="M55 275H705" stroke="#aabfc6" stroke-width="3"/>
    <path d="M110 267V216M82 267L110 216L139 267" fill="none" stroke="#506570" stroke-width="8"/>
    <path d="M70 163Q65 232 143 218Z" fill="#c6dbe3" stroke="#506570" stroke-width="4"/>
    <path d="M104 195L150 156" stroke="#506570" stroke-width="4"/>
    <circle cx="150" cy="156" r="6" fill="#506570"/>
    <path d="M176 145L570 145" stroke="#166d99" stroke-width="5" marker-end="url(#blue)"/>
    <path d="M570 213L176 213" stroke="#b75b22" stroke-width="5" marker-end="url(#orange)"/>
    <text x="322" y="121" font-size="27" fill="#166d99">vyslaný pulz</text>
    <text x="301" y="254" font-size="27" fill="#b75b22">část záření zpět</text>
    <g fill="#65a5c4" stroke="#166d99" stroke-width="2">
      <ellipse cx="611" cy="139" rx="8" ry="10"/><ellipse cx="660" cy="153" rx="10" ry="12"/>
      <ellipse cx="632" cy="188" rx="9" ry="11"/><ellipse cx="686" cy="204" rx="7" ry="9"/>
      <ellipse cx="601" cy="220" rx="8" ry="10"/>
    </g>
    <text x="580" y="105" font-size="27">kapky</text>
    <text x="59" y="308" font-size="27">radar</text>
    <text x="32" y="365" font-size="29" font-weight="700">Dvě informace v jednom echu</text>
    <rect x="30" y="392" width="700" height="94" rx="10" fill="#e0eef5"/>
    <text x="53" y="429" font-size="27" font-weight="700">Čas návratu + směr antény</text>
    <text x="53" y="466" font-size="26">Určí místo měření v atmosféře.</text>
    <rect x="30" y="510" width="700" height="116" rx="10" fill="#faeadf"/>
    <text x="53" y="547" font-size="27" font-weight="700">Síla echa → odrazivost</text>
    <text x="53" y="582" font-size="26">Kalibrace přístroje a započtení vzdálenosti</text>
    <text x="53" y="612" font-size="26">umožní porovnat různá místa.</text>
    <path d="M380 630V667" stroke="#506570" stroke-width="4" marker-end="url(#gray)"/>
    <rect x="30" y="679" width="700" height="94" rx="10" fill="#dceee7"/>
    <text x="53" y="717" font-size="27" font-weight="700">Odrazivost → odhad intenzity deště</text>
    <text x="53" y="753" font-size="26">Převod závisí na zvoleném vztahu Z–R.</text>
  </g>
</svg>
