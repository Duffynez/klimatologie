<svg xmlns="http://www.w3.org/2000/svg" width="640" height="910" viewBox="0 0 640 910" role="img" aria-labelledby="title desc">
<title id="title">Opakovaný cyklus asimilace v reanalýze 20CR</title>
<desc id="desc">Z předchozího stavu vzniká krátká předpověď. Pozorovací operátor poskytne modelový tlak v místě stanice. Měřený tlak se s ním porovná. Rozdíl a vztahy mezi 80 realizacemi upraví odhad celé atmosféry. Model pak pokračuje k dalšímu času.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#22676b" stroke-width="1.6"/></marker></defs>
<rect width="640" height="910" fill="#f5f6ef"/>
<g font-family="Arial, sans-serif" fill="#183b3d" text-anchor="middle">
<text x="320" y="45" font-size="28" font-weight="700">Model a měření se potkávají v čase</text>
<rect x="60" y="75" width="520" height="95" rx="10" fill="#dcebea"/>
<text x="320" y="113" font-size="27" font-weight="700">Krátká předpověď</text><text x="320" y="148" font-size="24">80 možných stavů atmosféry</text>
<path d="M320 178 V218" fill="none" stroke="#22676b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="230" width="520" height="90" rx="10" fill="white" stroke="#87aaa9" stroke-width="2"/>
<text x="320" y="267" font-size="25" font-weight="700">Modelový tlak v místě měření</text><text x="320" y="299" font-size="23">Stejný čas a výška jako u stanice</text>
<path d="M320 328 V376" fill="none" stroke="#22676b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="390" width="520" height="125" rx="10" fill="#fff" stroke="#bc553e" stroke-width="2"/>
<text x="320" y="426" font-size="26" font-weight="700">Porovnání s naměřeným tlakem</text><text x="320" y="462" font-size="24">Rozdíl určí směr opravy</text><text x="320" y="494" font-size="24">Nejistoty určí její váhu</text>
<path d="M320 523 V570" fill="none" stroke="#22676b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="585" width="520" height="125" rx="10" fill="#dcebea"/>
<text x="320" y="623" font-size="26" font-weight="700">Upravený odhad atmosféry</text><text x="320" y="659" font-size="24">Vztahy mezi realizacemi přenesou</text><text x="320" y="690" font-size="24">opravu i do souvisejících veličin</text>
<path d="M320 718 V762" fill="none" stroke="#22676b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="777" width="520" height="90" rx="10" fill="#fff" stroke="#87aaa9" stroke-width="2"/>
<text x="320" y="814" font-size="26" font-weight="700">Model pokračuje k dalšímu času</text><text x="320" y="848" font-size="24">Přicházejí další měření a cyklus se opakuje</text>
</g></svg>