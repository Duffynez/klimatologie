<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Dvě závislosti hustoty mořské vody</title><desc id="desc">Vypočtené křivky historické rovnice Millera a Poissona 1981 při jedné atmosféře. Při praktické salinitě 35 klesá hustota s teplotou v rozsahu 0 až 30 stupňů. Při 15 stupních hustota roste s praktickou salinitou od 30 do 40. Nejde o naměřené časové řady.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#b75a36" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="680" fill="#f8f5ee" /><text x="38" y="47" font-size="31" fill="#203d39" font-weight="700">Hustota závisí na obou veličinách</text><text x="38" y="80" font-size="20" fill="#243f3c" >Početní příklad z rovnice Millera a Poissona (1981), tlak 1 atmosféra</text><text x="91" y="128" font-size="24" fill="#203d39" font-weight="700">Při ohřevu hustota klesá</text><text x="91" y="157" font-size="20" fill="#243f3c" >Praktická salinita 35</text><line x1="91" y1="510" x2="499" y2="510" stroke="#d6dfd9" stroke-width="1" /><text x="79" y="516" font-size="17" fill="#405a56" text-anchor="end">1020</text><line x1="91" y1="456" x2="499" y2="456" stroke="#d6dfd9" stroke-width="1" /><text x="79" y="462" font-size="17" fill="#405a56" text-anchor="end">1022</text><line x1="91" y1="402" x2="499" y2="402" stroke="#d6dfd9" stroke-width="1" /><text x="79" y="408" font-size="17" fill="#405a56" text-anchor="end">1024</text><line x1="91" y1="348" x2="499" y2="348" stroke="#d6dfd9" stroke-width="1" /><text x="79" y="354" font-size="17" fill="#405a56" text-anchor="end">1026</text><line x1="91" y1="294" x2="499" y2="294" stroke="#d6dfd9" stroke-width="1" /><text x="79" y="300" font-size="17" fill="#405a56" text-anchor="end">1028</text><line x1="91" y1="240" x2="499" y2="240" stroke="#d6dfd9" stroke-width="1" /><text x="79" y="246" font-size="17" fill="#405a56" text-anchor="end">1030</text><line x1="91" y1="186" x2="499" y2="186" stroke="#d6dfd9" stroke-width="1" /><text x="79" y="192" font-size="17" fill="#405a56" text-anchor="end">1032</text><line x1="91" y1="510" x2="91" y2="516" stroke="#81948f" stroke-width="2" /><text x="91" y="540" font-size="18" fill="#405a56" text-anchor="middle">0</text><line x1="159" y1="510" x2="159" y2="516" stroke="#81948f" stroke-width="2" /><text x="159" y="540" font-size="18" fill="#405a56" text-anchor="middle">5</text><line x1="227" y1="510" x2="227" y2="516" stroke="#81948f" stroke-width="2" /><text x="227" y="540" font-size="18" fill="#405a56" text-anchor="middle">10</text><line x1="295" y1="510" x2="295" y2="516" stroke="#81948f" stroke-width="2" /><text x="295" y="540" font-size="18" fill="#405a56" text-anchor="middle">15</text><line x1="363" y1="510" x2="363" y2="516" stroke="#81948f" stroke-width="2" /><text x="363" y="540" font-size="18" fill="#405a56" text-anchor="middle">20</text><line x1="431" y1="510" x2="431" y2="516" stroke="#81948f" stroke-width="2" /><text x="431" y="540" font-size="18" fill="#405a56" text-anchor="middle">25</text><line x1="499" y1="510" x2="499" y2="516" stroke="#81948f" stroke-width="2" /><text x="499" y="540" font-size="18" fill="#405a56" text-anchor="middle">30</text><line x1="91" y1="186" x2="91" y2="510" stroke="#58756e" stroke-width="2" /><line x1="91" y1="510" x2="499" y2="510" stroke="#58756e" stroke-width="2" /><text x="295" y="578" font-size="19" fill="#243f3c" text-anchor="middle">Teplota (°C, stupnice IPTS-68)</text><text x="21" y="350" font-size="18" fill="#243f3c" text-anchor="middle" transform="rotate(-90 21 350)">Hustota (kg/m³)</text><path d="M91.00 291.13 L104.60 292.77 L118.20 294.76 L131.80 297.10 L145.40 299.77 L159.00 302.76 L172.60 306.07 L186.20 309.68 L199.80 313.60 L213.40 317.80 L227.00 322.28 L240.60 327.05 L254.20 332.08 L267.80 337.37 L281.40 342.93 L295.00 348