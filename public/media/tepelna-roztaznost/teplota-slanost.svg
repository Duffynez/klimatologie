<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Teplota a slanost mění objem vody</title><desc id="desc">Dva kontrolované pokusy při stejném tlaku. Vlevo se stejná hmotnost mořské vody při ohřevu rozpíná. Vpravo mají stejně těžké vzorky při stejné teplotě rozdílný objem: slanější je hustší. Dole plovák měří vrstvy oceánu, radar výšku a gravimetrie změnu hmotnosti. Rozdíly objemů jsou schematicky zvětšeny.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#b75a36" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="680" fill="#f8f5ee" /><text x="38" y="49" font-size="32" fill="#203d39" font-weight="700">Stejná hmotnost, jiný objem</text><text x="38" y="82" font-size="20" fill="#243f3c" >Kontrolovaná srovnání při stejném tlaku</text><line x1="550" y1="115" x2="550" y2="407" stroke="#d4dcd5" stroke-width="1" /><text x="38" y="133" font-size="19" fill="#7c4931" font-weight="700">OHŘEV JEDNOHO VZORKU</text><text x="38" y="165" font-size="20" fill="#243f3c" >Stejná slanost, voda neuniká.</text><rect x="89" y="257" width="104" height="93" fill="#b2d5de" /><path d="M86 190V350H196V190" fill="none" stroke="#486c6c" stroke-width="3"/><rect x="346" y="228" width="104" height="122" fill="#e4b59f" /><path d="M343 190V350H453V190" fill="none" stroke="#486c6c" stroke-width="3"/><text x="141" y="381" font-size="20" fill="#243f3c" text-anchor="middle">chladnější</text><text x="398" y="381" font-size="20" fill="#243f3c" text-anchor="middle">teplejší</text><line x1="219" y1="283" x2="310" y2="283" stroke="#b75a36" stroke-width="4" marker-end="url(#arrow)"/><text x="233" y="265" font-size="19" fill="#9b4b2d" >teplo</text><text x="346" y="211" font-size="19" fill="#9b4b2d" >větší objem</text><text x="339" y="405" font-size="20" fill="#243f3c" >menší hustota</text><text x="588" y="133" font-size="19" fill="#1d6069" font-weight="700">DVA RŮZNĚ SLANÉ VZORKY</text><text x="588" y="165" font-size="20" fill="#243f3c" >Stejná teplota i celková hmotnost.</text><rect x="638" y="228" width="104" height="122" fill="#b2d5de" /><path d="M635 190V350H745V190" fill="none" stroke="#486c6c" stroke-width="3"/><circle cx="655" cy="246" r="4" fill="#194d55"/><circle cx="679" cy="246" r="4" fill="#194d55"/><circle cx="703" cy="246" r="4" fill="#194d55"/><circle cx="727" cy="246" r="4" fill="#194d55"/><rect x="895" y="257" width="104" height="93" fill="#91c2c9" /><path d="M892 190V350H1002V190" fill="none" stroke="#486c6c" stroke-width="3"/><circle cx="912" cy="275" r="4" fill="#194d55"/><circle cx="936" cy="275" r="4" fill="#194d55"/><circle cx="960" cy="275" r="4" fill="#194d55"/><circle cx="984" cy="275" r="4" fill="#194d55"/><circle cx="912" cy="303" r="4" fill="#194d55"/><circle cx="936" cy="303" r="4" fill="#194d55"/><circle cx="960" cy="303" r="4" fill="#194d55"/><circle cx="984" cy="303" r="4" fill="#194d55"/><text x="690" y="381" font-size="20" fill="#243f3c" text-anchor="middle">méně slaný</text><text x="947" y="381" font-size="20" fill="#243f3c" text-anchor="middle">slanější</text><text x="891" y="241" font-size="19" fill="#1d6069" >menší objem</text><text x="892" y="405" font-size="20" fill="#243f3c" >větší hustota</text><rect x="30" y="437" width="1040" height="180" fill="#e6efec" rx="8"/><text x="50" y="470" font-size="24" fill="#203d39" font-weight="700">V oceánu potřebujeme měření po vrstvách</text><path d="M50 523Q72 511 94 523T138 523T182 523T226 523T270 523T314 523T358 523T402 523" fill="none" stroke="#568a95" stroke-width="3"/><rect x="194" y="506" width="22" height="64" fill="#d5a041" rx="8"/><line x1="205" y1="599" x2="205" y2="575" stroke="#b75a36" stroke-width="3" marker-end="url(#arrow)"/><text x="245" y="562" font-size="18" fill="#243f3c" >teplota, slanost, tlak</text><text x="245" y="587" font-size="18" fill="#243f3c" >→ hustota a objem vrstev</text><text x="521" y="516" font-size="21" fill="#243f3c" >Radar měří výšku hladiny.</text><text x="521" y="551" font-size="21" fill="#243f3c" >Gravimetrie určuje změnu hmotnosti.</text><text x="521" y="586" font-size="21" fill="#243f3c" >Společně kontrolují výsledek přepočtu.</text><text x="38" y="650" font-size="18" fill="#243f3c" >Kvalitativní schéma. Změny objemu silně zvětšeny. Tečky označují rozpuštěné soli.</text></g></svg>
