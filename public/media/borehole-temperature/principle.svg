<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1080" viewBox="0 0 960 1080" role="img" aria-labelledby="title desc">
<title id="title">Jak vrt uchovává a odhaluje změny teploty povrchu</title>
<desc id="desc">Teplo z povrchu proniká do podzemí, kde se přidává k hlubinnému teplu. Sonda měří teploty v různých hloubkách. Z profilu odečteme pozadí a pomocí vedení tepla hledáme minulou povrchovou teplotu.</desc>
<defs>
<marker id="rust" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#bd553c"/></marker>
<marker id="green" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#28605a"/></marker>
<linearGradient id="heat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7b49e"/><stop offset="0.6" stop-color="#f1e5d4"/><stop offset="1" stop-color="#e4e8de"/></linearGradient>
</defs>
<rect width="960" height="1080" rx="16" fill="#f7f6f0"/>
<g font-family="Arial, sans-serif" fill="#173b3d">
<text x="48" y="64" font-size="44" font-weight="700">Změna povrchu se šíří do podzemí</text>
<rect x="48" y="154" width="864" height="338" fill="url(#heat)"/>
<path d="M48 154 H912" stroke="#777d68" stroke-width="5"/>
<text x="66" y="129" font-size="37" fill="#a04733">oteplený povrch</text>
<g stroke="#bd553c" stroke-width="6" marker-end="url(#rust)"><path d="M144 179 V260"/><path d="M250 179 V308"/><path d="M356 179 V261"/></g>
<text x="65" y="365" font-size="35">vedení tepla</text>
<text x="65" y="410" font-size="35">do větší hloubky</text>
<rect x="593" y="153" width="60" height="339" fill="#fff" stroke="#597478" stroke-width="3"/>
<path d="M624 94 V321" stroke="#173b3d" stroke-width="5"/>
<rect x="609" y="321" width="30" height="65" rx="10" fill="#bd553c"/>
<text x="682" y="235" font-size="35">vrt</text>
<text x="682" y="349" font-size="35">teplotní</text>
<text x="682" y="393" font-size="35">sonda</text>
<path d="M670 357 H641" stroke="#173b3d" stroke-width="3"/>
<path d="M487 481 V433" stroke="#28605a" stroke-width="5" marker-end="url(#green)"/>
<text x="65" y="548" font-size="36">Z hlubšího nitra přichází další teplo.</text>
<rect x="48" y="588" width="864" height="119" rx="12" fill="white" stroke="#d5ded8" stroke-width="2"/>
<text x="78" y="639" font-size="40" font-weight="700">1. Změříme teplotní profil</text>
<text x="78" y="684" font-size="34">Teplota a hloubka každého měření.</text>
<path d="M480 715 V744" stroke="#28605a" stroke-width="4" marker-end="url(#green)"/>
<rect x="48" y="762" width="864" height="119" rx="12" fill="white" stroke="#d5ded8" stroke-width="2"/>
<text x="78" y="813" font-size="40" font-weight="700">2. Odečteme hlubinné pozadí</text>
<text x="78" y="858" font-size="34">Zůstane profil teplotních odchylek.</text>
<path d="M480 889 V918" stroke="#28605a" stroke-width="4" marker-end="url(#green)"/>
<rect x="48" y="936" width="864" height="119" rx="12" fill="white" stroke="#d5ded8" stroke-width="2"/>
<text x="78" y="987" font-size="40" font-weight="700">3. Hledáme historii povrchu</text>
<text x="78" y="1032" font-size="34">Výpočet musí vysvětlit měřenou stopu.</text>
</g></svg>
