<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc">
<title id="title">Led a vzduch mají různé stáří</title>
<desc id="desc">Sníh přechází v porézní firn a pak v led. Vzduch se v otevřených pórech promíchává, teprve níže se uzavře. Analýza jádra odděluje datum vrstvy ledu od data a složení uzavřeného vzduchu.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#237a8b" stroke-width="1.5"/></marker></defs>
<rect width="720" height="980" rx="16" fill="#f5f9fa"/>
<g font-family="Arial, sans-serif" fill="#18394b">
<text x="36" y="50" font-size="32" font-weight="700">Led a vzduch mají různé stáří</text>
<text x="36" y="105" font-size="28">Atmosféra nad sněhem</text>
<path d="M93 125 V195 M148 195 V125 M203 125 V195" fill="none" stroke="#237a8b" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="36" y="212" width="648" height="128" rx="8" fill="#e9f0f2"/>
<rect x="36" y="352" width="648" height="160" rx="8" fill="#d8e9ee"/>
<rect x="36" y="524" width="648" height="156" rx="8" fill="#b9d9e5"/>
<g fill="white" stroke="#4c94ad" stroke-width="3">
<circle cx="82" cy="256" r="20"/><circle cx="138" cy="291" r="20"/><circle cx="204" cy="256" r="20"/>
<circle cx="84" cy="396" r="17"/><circle cx="135" cy="439" r="17"/><circle cx="194" cy="396" r="17"/><circle cx="198" cy="473" r="17"/>
<circle cx="84" cy="568" r="12"/><circle cx="135" cy="619" r="12"/><circle cx="198" cy="574" r="12"/>
</g>
<path d="M82 276 L122 283 M157 282 L188 269 M84 413 L121 432 M150 428 L181 406 M148 446 L182 464" stroke="white" stroke-width="9"/>
<text x="266" y="256" font-size="31" font-weight="700">Sníh</text>
<text x="266" y="300" font-size="27">Mezi zrny je volný vzduch.</text>
<text x="266" y="395" font-size="31" font-weight="700">Firn</text>
<text x="266" y="438" font-size="27">Póry jsou ještě propojené.</text>
<text x="266" y="479" font-size="27">Vzduch se promíchává.</text>
<text x="266" y="567" font-size="31" font-weight="700">Led</text>
<text x="266" y="610" font-size="27">Bublinky jsou uzavřené.</text>
<text x="266" y="650" font-size="27">Vzduch je mladší než led.</text>
<text x="36" y="731" font-size="30" font-weight="700">Dvě informace z téhož jádra</text>
<path d="M360 750 H183 V783 M360 750 H537 V783" fill="none" stroke="#237a8b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="36" y="796" width="312" height="145" rx="10" fill="#ffffff" stroke="#8eb0bd" stroke-width="2"/>
<rect x="372" y="796" width="312" height="145" rx="10" fill="#ffffff" stroke="#8eb0bd" stroke-width="2"/>
<text x="62" y="835" font-size="28" font-weight="700">Vrstvy ledu</text>
<text x="62" y="879" font-size="26">Určení data sněhu,</text>
<text x="62" y="917" font-size="26">z něhož vznikl led</text>
<text x="396" y="835" font-size="28" font-weight="700">Vzduch v ledu</text>
<text x="396" y="879" font-size="26">Změření složení</text>
<text x="396" y="917" font-size="26">a určení data plynu</text>
</g></svg>
