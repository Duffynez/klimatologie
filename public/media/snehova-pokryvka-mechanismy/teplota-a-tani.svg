t="13" rx="6" fill="#276b59"/><path d="M707 434L707 476" stroke="#276b59" stroke-width="3" fill="none"/><circle cx="684" cy="475" r="19" fill="#276b59"/><text x="678" y="482" fill="#fff" font-size="21" font-weight="700">3</text><text x="715" y="483" fill="#276b59" font-size="22" font-weight="700">Měření zásoby</text><path d="M867 432L1019 480" stroke="#407b9c" stroke-width="5" fill="none" marker-end="url(#a407b9c)"/><text x="879" y="506" fill="#407b9c" font-size="21" font-weight="700">Odtok vody</text><text x="43" y="478" fill="#263d43" font-size="22" font-weight="400">Tání mění led ve vodu.</text><text x="43" y="507" fill="#263d43" font-size="22" font-weight="400">Zásoba klesá až jejím odchodem.</text><path d="M36 536H1064" stroke="#cad7d7" stroke-width="2"/><circle cx="57" cy="575" r="19" fill="#276b59"/><text x="51" y="582" fill="#fff" font-size="21" font-weight="700">4</text><text x="88" y="582" fill="#276b59" font-size="24" font-weight="700">Kontrola v povodích</text><text x="390" y="576" fill="#263d43" font-size="22" font-weight="400">Mírná zima: více srážek může přicházet jako déšť.</text><text x="390" y="611" fill="#263d43" font-size="22" font-weight="400">Studená zima: větší sněžení může zásobu zvýšit.</text><text x="38" y="642" fill="#263d43" font-size="18" font-weight="400">Zkoušky: Jennings 2018 · Musselman 2017 · Gottlieb a Mankin 2024. Kvalitativní schéma.</text></g></svg>
