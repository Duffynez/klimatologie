<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">Teplota ovlivňuje vznik sněhu i jeho zánik</title><desc id="desc">Srážky procházejí vzduchem a dopadají jako sníh nebo déšť. Na zemi sníh přijímá energii, taje a uvolňuje vodu. Teploměr, vlhkoměr, sněhová poduška a srovnání povodí ověřují různé části mechanismu.</desc><defs><marker id="a407b9c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#407b9c"/></marker><marker id="ab66a30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b66a30"/></marker><marker id="a276b59" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#276b59"/></marker></defs><rect width="1100" height="660" fill="#faf9f4"/><g font-family="Arial, sans-serif"><text x="38" y="45" fill="#263d43" font-size="29" font-weight="700">2 · Stejný úhrn srážek, jiný průběh sněhové sezony</text><path d="M95 186C65 161 97 130 125 143C133 103 195 106 205 139C252 125 280 172 250 186Z" fill="#dce7ec" stroke="#91aeba" stroke-width="2"/><path d="M372 186C342 161 374 130 402 143C410 103 472 106 482 139C529 125 557 172 527 186Z" fill="#dce7ec" stroke="#91aeba" stroke-width="2"/><text x="38" y="99" fill="#407b9c" font-size="22" font-weight="700">Chladnější vzduch</text><text x="365" y="99" fill="#b66a30" font-size="22" font-weight="700">Teplejší vzduch</text><g stroke="#407b9c" stroke-width="2.5"><path d="M103 220L117 220" stroke="#407b9c" stroke-width="2.5" fill="none"/><path d="M110 213L110 227" stroke="#407b9c" stroke-width="2.5" fill="none"/><path d="M105 215L115 225" stroke="#407b9c" stroke-width="2.5" fill="none"/><path d="M105 225L115 215" stroke="#407b9c" stroke-width="2.5" fill="none"/></g><g stroke="#407b9c" stroke-width="2.5">