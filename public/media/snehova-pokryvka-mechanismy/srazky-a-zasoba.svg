<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">Méně srážek při stejných podmínkách tání</title><desc id="desc">Porovnání dvou stejných svahů. Menší zimní přísun sněhu vytváří menší zásobu. Srážkoměr a sněhový odběr měří rozdílné části bilance. Kvalitativní schéma bez měřítka.</desc><defs><marker id="a407b9c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#407b9c"/></marker><marker id="ab66a30" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b66a30"/></marker><marker id="a276b59" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#276b59"/></marker></defs><rect width="1100" height="660" fill="#faf9f4"/><g font-family="Arial, sans-serif"><text x="38" y="45" fill="#263d43" font-size="30" font-weight="700">1 · Co by způsobila sušší zima?</text><text x="38" y="78" fill="#263d43" font-size="21" font-weight="400">Srovnáváme stejný svah při stejném podílu sněžení a stejných podmínkách tání.</text><rect x="35" y="106" width="495" height="377" rx="12" fill="#eef4f6"/><text x="59" y="141" fill="#263d43" font-size="24" font-weight="700">Větší přísun sněhu</text><path d="M107 241C77 216 109 185 137 198C145 158 207 161 217 194C264 180 292 227 262 241Z" fill="#dce7ec" stroke="#91aeba" stroke-width="2"/><g stroke="#407b9c" stroke-width="2.5"><path d="M116 259L130 259" stroke="#407b9c" stroke-width="2.5" fill="none"/><path d="M123 252L123 266" stroke="#407b9c" stroke-width="2.5" fill="none"/><path d="M118 254L128 264" stroke="#407b9c" stroke-width="2.5" fill="none"/><path d="M118 264L128 254" stroke="#407b9c" stroke-width="2.5" fill="none"/></g><g stroke="#407b9c" stroke-width="2.5"><path d="M163 275L177 275" stroke="#407b9c" stroke-width="2