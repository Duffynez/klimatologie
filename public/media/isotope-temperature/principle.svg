<svg xmlns="http://www.w3.org/2000/svg" width="700" height="940" viewBox="0 0 700 940" role="img" aria-labelledby="title desc">
<title id="title">Od schránky k teplotě minulého oceánu</title>
<desc id="desc">Ze sedimentární vrstvy získáme schránky. Laboratorní měření určí jejich izotopové složení. To spojíme s odhadem složení vody a s kalibračním vztahem. Vypočtené teplotě přiřadíme stáří vrstvy.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#357075"/></marker></defs>
<rect width="700" height="940" fill="#f6f6f2"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#17363a">
<text x="350" y="47" font-size="30" font-weight="700">Od schránky k teplotě</text>
<rect x="55" y="80" width="590" height="100" rx="8" fill="#fff" stroke="#b6cbca"/>
<text x="350" y="121" font-size="29" font-weight="700">Schránky z jedné vrstvy</text>
<text x="350" y="157" font-size="25">Výběr druhu a příprava vzorku</text>
<path d="M350 183V222" stroke="#357075" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="230" width="590" height="112" rx="8" fill="#fff" stroke="#b6cbca"/>
<text x="350" y="272" font-size="29" font-weight="700">Laboratorní měření</text>
<text x="350" y="310" font-size="25">Příprava CO₂ → spektrometr → δ¹⁸O</text>
<path d="M135 344V400" stroke="#357075" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="25" y="410" width="210" height="130" rx="8" fill="#e5efed"/>
<text x="130" y="449" font-size="25" font-weight="700">Schránka</text>
<text x="130" y="488" font-size="24">Změřené</text><text x="130" y="518" font-size="24">δ¹⁸O kalcitu</text>
<rect x="245" y="410" width="210" height="130" rx="8" fill="#e5efed"/>
<text x="350" y="449" font-size="25" font-weight="700">Voda</text>
<text x="350" y="488" font-size="24">Odhad jejího</text><text x="350" y="518" font-size="24">δ¹⁸O v minulosti</text>
<rect x="465" y="410" width="210" height="130" rx="8" fill="#f4e6de"/>
<text x="570" y="449" font-size="25" font-weight="700">Kalibrace</text>
<text x="570" y="488" font-size="24">Vztah z pokusů</text><text x="570" y="518" font-size="24">při známé teplotě</text>
<path d="M130 543V571H570V543M350 543V610" fill="none" stroke="#357075" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="620" width="590" height="104" rx="8" fill="#205f62"/>
<text x="350" y="662" font-size="29" font-weight="700" fill="#fff">Výpočet teploty vody</text>
<text x="350" y="700" font-size="25" fill="#fff">Teplota při růstu schránky</text>
<path d="M350 727V782" stroke="#357075" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="792" width="590" height="116" rx="8" fill="#fff" stroke="#bf563d" stroke-width="2"/>
<text x="350" y="833" font-size="27" font-weight="700">Datování přiřadí stáří vrstvy</text>
<text x="350" y="874" font-size="25">Výsledek: teplota v určitém čase</text>
</g></svg>
