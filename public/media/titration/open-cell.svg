<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">Otevřená titrace mořské vody</title>
<desc id="desc">Známé dávky kyseliny přicházejí z byrety do míchaného vzorku. Vzduch odvádí oxid uhličitý. Elektroda a teploměr zaznamenávají reakci vzorku pro výpočet alkalinity.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b75b21"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2e718a"/></marker>
</defs>
<rect width="900" height="540" rx="12" fill="#f5f8fa"/>
<g font-family="Arial,sans-serif" fill="#19384a">
<text x="36" y="45" font-size="27" font-weight="bold">Otevřená titrace</text>
<text x="36" y="78" font-size="19">Dávka kyseliny + odezva vzorku → výpočet alkalinity</text>
<text x="45" y="132" font-size="21" font-weight="bold">Byreta</text>
<text x="45" y="159" font-size="18">Kyselina se známou</text><text x="45" y="183" font-size="18">koncentrací a hustotou</text>
<rect x="80" y="205" width="110" height="110" rx="8" fill="#fff" stroke="#b75b21" stroke-width="3"/>
<rect x="105" y="220" width="60" height="65" rx="3" fill="#f7dcc6"/>
<path d="M105 230H165M135 205V230M135 285V309" stroke="#b75b21" stroke-width="4"/>
<path d="M190 270H350V325" fill="none" stroke="#b75b21" stroke-width="4" marker-end="url(#arrow)"/>
<text x="206" y="252" font-size="18">Odměřené dávky</text>
<rect x="298" y="286" width="282" height="145" rx="16" fill="#c8e2ed" stroke="#7fa9bc" stroke-width="2"/>
<path d="M316 265V410H561V265" fill="#fff" stroke="#477084" stroke-width="3"/>
<path d="M318 328H559V408H318Z" fill="#acd7e6"/>
<text x="345" y="369" font-size="21">Mořská voda</text>
<text x="345" y="395" font-size="17">Známá hmotnost</text>
<rect x="402" y="411" width="78" height="9" rx="4" fill="#355b6a"/>
<rect x="326" y="443" width="225" height="45" rx="7" fill="#dbe4e9" stroke="#477084" stroke-width="2"/>
<text x="373" y="473" font-size="21">Míchadlo</text>
<text x="50" y="410" font-size="18">Vodní plášť udržuje</text><text x="50" y="434" font-size="18">teplotu vzorku.</text>
<path d="M235 415H295" stroke="#2e718a" stroke-width="2" marker-end="url(#blue)"/>
<path d="M330 235V205H370V342" fill="none" stroke="#2e718a" stroke-width="3"/>
<text x="245" y="220" font-size="18">Vzduch</text>
<g fill="none" stroke="#2e718a" stroke-width="2"><circle cx="374" cy="320" r="4"/><circle cx="369" cy="302" r="5"/><circle cx="379" cy="283" r="4"/></g>
<path d="M395 280V236" stroke="#2e718a" stroke-width="2" marker-end="url(#blue)"/>
<text x="359" y="182" font-size="18">Únik CO₂</text>
<path d="M477 181V341" stroke="#31596a" stroke-width="13" stroke-linecap="round"/>
<circle cx="477" cy="343" r="9" fill="#e5ab5d"/>
<path d="M541 201V343" stroke="#7c5757" stroke-width="7" stroke-linecap="round"/>
<text x="437" y="145" font-size="19">Elektroda</text><text x="511" y="180" font-size="18">Teploměr</text>
<path d="M477 181V158H641V230H668M541 201H623V271H668" fill="none" stroke="#577385" stroke-width="2"/>
<rect x="668" y="200" width="194" height="115" rx="9" fill="#fff" stroke="#577385" stroke-width="2"/>
<text x="691" y="231" font-size="21" font-weight="bold">Záznam</text>
<text x="691" y="263" font-size="20">Napětí a teplota</text><text x="691" y="290" font-size="20">Přidaný objem</text>
<path d="M763 317V354" stroke="#2e718a" stroke-width="3" marker-end="url(#blue)"/>
<rect x="653" y="365" width="224" height="70" rx="8" fill="#e2ece5"/>
<text x="681" y="394" font-size="21">Výpočet spotřeby</text><text x="681" y="421" font-size="21">kyseliny → A<tspan baseline-shift="sub" font-size="14">T</tspan></text>
<text x="36" y="520" font-size="17" fill="#536c78">Schéma principu podle SOP 3b. Rozměry a uspořádání jsou zjednodušené.</text>
</g>
</svg>
