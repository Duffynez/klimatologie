<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">Pohyb ledu: šelf může přenášet odpor proti toku</title><desc id="desc">Dva schematické řezy ukazují ukotvený led a plovoucí šelf. Vlevo se šelf opírá o podmořskou vyvýšeninu a může brzdit ledovec. Vpravo ztenčení či rozpad oporu zeslabí a led z pevniny může zrychlit. Oceánská voda může tavit spodní stranu šelfu.</desc>
<style>svg{--sea:#1d5d58;--heat:#b65a36;--water:#287aa1;--resist:#8b3857;font-family:Arial,sans-serif}path,line,rect,circle{vector-effect:non-scaling-stroke}</style>
<defs><marker id="sea" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#1d5d58"/></marker><marker id="heat" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b65a36"/></marker><marker id="water" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#287aa1"/></marker><marker id="resist" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8b3857"/></marker></defs>
<rect width="1100" height="660" rx="12" fill="#f8f5ed"/>
<text x="38" y="48" font-size="29" fill="#173b3f" font-weight="700" text-anchor="start"><tspan x="38" dy="0">Pohyb ledu: šelf může přenášet odpor proti toku</tspan></text>
<text x="38" y="84" font-size="22" fill="#173b3f" font-weight="400" text-anchor="start"><tspan x="38" dy="0">Ztráta plovoucího ledu může změnit tok ledu, který dosud leží na podloží.</tspan></text>
  <rect x="38" y="110" width="495" height="367" rx="8" fill="#fff" stroke="#c5d3cd"/>
  <rect x="553" y="110" width="509" height="367" rx="8" fill="#fff" stroke="#c5d3cd"/>
  <text x="58" y="147" font-size="23" fill="#173b3f" font-weight="700" text-anchor="start"><tspan x="58" dy="0">A • Šelf s mechanickou oporou</tspan></text>
  <text x="573" y="147" font-size="23" fill="#173b3f" font-weight="700" text-anchor="start"><tspan x="573" dy="0">B • Oslabení nebo ztráta opory</tspan></text>
