  <path d="M205 332L193 386" stroke="#b65a36" stroke-width="2"/>
  <text x="66" y="410" font-size="21" fill="#173b3f" font-weight="400" text-anchor="start"><tspan x="66" dy="0">Linie ukotvení</tspan></text>
  <path d="M423 341L423 417" stroke="#526869" stroke-width="2"/>
  <text x="317" y="440" font-size="21" fill="#173b3f" font-weight="400" text-anchor="start"><tspan x="317" dy="0">Kontakt se dnem</tspan></text>
  <path d="M1030 352Q1000 318 962 318Q914 317 876 325L805 342" fill="none" stroke="var(--heat)" stroke-width="5" marker-end="url(#heat)"/>
  <text x="777" y="414" font-size="21" fill="#9c482d" font-weight="400" text-anchor="start"><tspan x="777" dy="0">Teplo z oceánu může</tspan><tspan x="777" dy="29">tavit šelf zespodu.</tspan></text>
  <rect x="38" y="495" width="1024" height="111" rx="8" fill="#e8efea"/>
  <text x="58" y="526" font-size="23" fill="#173b3f" font-weight="700" text-anchor="start"><tspan x="58" dy="0">Opora závisí na geometrii a kontaktech.</tspan></text>
  <text x="58" y="558" font-size="21" fill="#173b3f" font-weight="400" text-anchor="start"><tspan x="58" dy="0">Odpor přenášejí také boky zálivu, které v řezu nejsou vidět.</tspan><tspan x="58" dy="29">Ne každý plovoucí okraj brzdí stejně. Rozpad a spodní tání jsou různé děje.</tspan></text>
<text x="38" y="639" font-size="18" fill="#526869" font-weight="400" text-anchor="start"><tspan x="38" dy="0">Kvalitativní schéma • délky šipek ani rozměry neudávají měřené hodnoty</tspan></text>
</svg>
