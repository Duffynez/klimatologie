  <path d="M403 313L326 313" fill="none" stroke="var(--resist)" stroke-width="5" marker-end="url(#resist)"/>
  <text x="266" y="294" font-size="18" fill="#8b3857" font-weight="400" text-anchor="start"><tspan x="266" dy="0">Odpor proti toku</tspan></text>
  <text x="283" y="197" font-size="23" fill="#173b3f" font-weight="700" text-anchor="start"><tspan x="283" dy="0">Plovoucí šelf</tspan></text>
  <path d="M369 209L369 262" stroke="#526869" stroke-width="2"/>
  <text x="58" y="184" font-size="20" fill="#173b3f" font-weight="400" text-anchor="start"><tspan x="58" dy="0">Led na podloží</tspan></text>
  <text x="575" y="184" font-size="22" fill="#1d5d58" font-weight="700" text-anchor="start"><tspan x="575" dy="0">Přítok může zrychlit.</tspan></text>
  <text x="838" y="236" font-size="22" fill="#173b3f" font-weight="400" text-anchor="start"><tspan x="838" dy="0">Rozpad</tspan></text>
  <path d="M927 244L927 271" stroke="#526869" stroke-width="2"/>
