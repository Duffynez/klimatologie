<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc">
<title id="title">Měření vodní páry pozemní stanicí GNSS</title>
<desc id="desc">Signály družic přicházejí ke stanici z různých směrů. Jejich zpracování určí celkové zpoždění pro svislý směr. Tlak umožní odečíst hydrostatickou část. Vážená teplota určí převod zbývajícího mokrého zpoždění na množství vody.</desc>
