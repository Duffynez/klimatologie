<svg xmlns="http://www.w3.org/2000/svg" width="560" height="540" viewBox="0 0 560 540" role="img" aria-labelledby="title desc">
  <title id="title">Princip tepelného pyranometru</title>
  <desc id="desc">Záření prochází skleněnou kopulkou na černou přijímací plochu. Termočlánky převádějí rozdíl teplot mezi přijímačem a tělem na napětí.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#b66017"/></marker></defs>
  <rect width="560" height="540" rx="12" fill="#f4f7f5"/>
  <g font-family="Arial, sans-serif" fill="#233e38">
    <text x="280" y="40" text-anchor="middle" font-size="24" font-weight="bold">Ohřev přijímače vytváří signál</text>
    <path d="M80 260A180 180 0 0 1 440 260" fill="#dfedf1" fill-opacity="0.65" stroke="#79a8b3" stroke-width="5"/>
    <g stroke="#b66017" stroke-width="5" marker-end="url(#arrow)">
      <path d="M140 75L215 235"/><path d="M225 75L265 235"/><path d="M320 75L315 235"/>
    </g>
    <rect x="80" y="270" width="360" height="105" rx="8" fill="#b5c2bf"/>
    <rect x="165" y="245" width="190" height="15" rx="3" fill="#202b2c"/>
    <path d="M180 260V302H202V264H224V302H246V264H268V302H290V264H312V302H334V260" fill="none" stroke="#8e4c42" stroke-width="4"/>
    <path d="M180 302V409H355M334 302V423H355" fill="none" stroke="#46625b" stroke-width="3"/>
    <rect x="355" y="390" width="170" height="63" rx="7" fill="white" stroke="#658a7d" stroke-width="2"/>
    <text x="440" y="415" text-anchor="middle" font-size="20">Měření napětí</text>
    <text x="440" y="441" text-anchor="middle" font-size="22">U</text>
    <text x="385" y="105" font-size="20">Skleněná</text><text x="385" y="129" font-size="20">kopulka</text>
    <path d="M386 138L399 158" stroke="#658a7d" stroke-width="2"/>
    <text x="25" y="207" font-size="20">Černý</text><text x="25" y="231" font-size="20">přijímač</text>
    <path d="M116 233L164 252" stroke="#46625b" stroke-width="2"/>
    <text x="260" y="336" text-anchor="middle" font-size="20">Tělo přístroje</text>
    <text x="25" y="409" font-size="20">Termočlánky</text><path d="M98 384L178 290" stroke="#8e4c42" stroke-width="2"/>
    <text x="280" y="493" text-anchor="middle" font-size="21">Více záření → větší rozdíl teplot</text>
    <text x="280" y="520" text-anchor="middle" font-size="21">→ větší napětí</text>
  </g>
</svg>
