<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Od vody k izotopovému poměru</title>
  <desc id="desc">Voda se uvede do izotopové rovnováhy s CO2. Upravený plyn se střídá s pracovním plynem, ionizuje a rozdělí magnetem. Detektory měří svazky 44, 45 a 46. Referenční vody určují převod na delta 18O.</desc>
  <defs>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24677b"/></marker>
    <marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#ac6329"/></marker>
    <marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536978"/></marker>
  </defs>
  <rect width="1000" height="650" fill="#f4f7f8" rx="16"/>
  <g font-family="Arial, sans-serif" fill="#203747">
    <text x="32" y="45" font-size="28" font-weight="700">Od vody k izotopovému poměru</text>
    <rect x="32" y="80" width="220" height="105" rx="12" fill="#e2eff3" stroke="#9cbbc6"/>
    <text x="50" y="112" font-size="22" font-weight="700">Vzorek vody + CO₂</text>
    <text x="50" y="142" font-size="20">stálá teplota</text>
    <text x="50" y="168" font-size="20">a dostatek času</text>
    <path d="M252 132H302" stroke="#24677b" stroke-width="3" marker-end="url(#blue)"/>
    <rect x="308" y="80" width="276" height="105" rx="12" fill="#e2eff3" stroke="#9cbbc6"/>
    <text x="328" y="112" font-size="22" font-weight="700">Izotopová rovnováha</text>
    <text x="328" y="142" font-size="20">CO₂ získá informaci</text>
    <text x="328" y="168" font-size="20">o kyslíku ve vodě</text>
    <path d="M584 132H633" stroke="#24677b" stroke-width="3" marker-end="url(#blue)"/>
    <rect x="640" y="80" width="326" height="105" rx="12" fill="#e2eff3" stroke="#9cbbc6"/>
    <text x="660" y="112" font-size="22" font-weight="700">Odběr a vysušení CO₂</text>
    <text x="660" y="142" font-size="20">plyn připravený pro měření</text>
    <text x="660" y="168" font-size="20">ve vysokém vakuu</text>
    <path d="M805 185V215H135V258" fill="none" stroke="#24677b" stroke-width="3" marker-end="url(#blue)"/>
    <rect x="32" y="265" width="205" height="62" rx="10" fill="#e2eff3" stroke="#9cbbc6"/>
    <text x="50" y="303" font-size="22">CO₂ ze vzorku</text>
    <rect x="32" y="410" width="205" height="62" rx="10" fill="#f7ecdf" stroke="#d2ab81"/>
    <text x="50" y="448" font-size="22">Pracovní CO₂</text>
    <path d="M237 296H272V352H298" fill="none" stroke="#24677b" stroke-width="3" marker-end="url(#blue)"/>
    <path d="M237 441H272V384H298" fill="none" stroke="#ac6329" stroke-width="3" marker-end="url(#orange)"/>
    <circle cx="320" cy="368" r="25" fill="white" stroke="#536978" stroke-width="3"/>
    <path d="M305 379L333 357" stroke="#536978" stroke-width="3"/>
    <text x="292" y="425" font-size="19">ventil</text>
    <path d="M346 368H380" stroke="#536978" stroke-width="3" marker-end="url(#gray)"/>
    <rect x="388" y="295" width="167" height="147" rx="12" fill="white" stroke="#9cbbc6"/>
    <text x="407" y="326" font-size="22" font-weight="700">Iontový zdroj</text>
    <text x="409" y="362" font-size="22">CO₂ → CO₂⁺</text>
    <text x="408" y="397" font-size="20">elektrony,</text>
    <text x="408" y="423" font-size="20">urychlení</text>
    <rect x="585" y="257" width="195" height="225" rx="16" fill="#e9edf0" stroke="#bec9d1"/>
    <text x="614" y="287" font-size="22" font-weight="700">Magnet</text>
    <path d="M555 420H605Q679 420 757 319H840" fill="none" stroke="#24677b" stroke-width="4"/>
    <path d="M555 420H605Q679 420 757 368H840" fill="none" stroke="#4b8870" stroke-width="4"/>
    <path d="M555 420H605Q679 420 757 417H840" fill="none" stroke="#ac6329" stroke-width="4"/>
    <text x="598" y="462" font-size="19">rozdělení podle m/z</text>
    <g fill="white" stroke="#536978" stroke-width="2"><rect x="840" y="303" width="115" height="32" rx="5"/><rect x="840" y="352" width="115" height="32" rx="5"/><rect x="840" y="401" width="115" height="32" rx="5"/></g>
    <text x="857" y="326" font-size="20">44</text><text x="857" y="375" font-size="20">45</text><text x="857" y="424" font-size="20">46</text>
    <text x="823" y="278" font-size="20" font-weight="700">Detektory</text>
    <path d="M899 438V503H688V533" fill="none" stroke="#536978" stroke-width="3" marker-end="url(#gray)"/>
    <rect x="388" y="540" width="578" height="78" rx="12" fill="#e2eff3" stroke="#9cbbc6"/>
    <text x="408" y="570" font-size="22" font-weight="700">Proudy → poměry → korekce → δ¹⁸O</text>
    <text x="408" y="600" font-size="20">Kalibraci celého postupu určují referenční vody.</text>
    <text x="32" y="550" font-size="20">Referenční vody projdou</text>
    <text x="32" y="578" font-size="20">stejnou cestou jako vzorek.</text>
    <text x="32" y="615" font-size="18" fill="#536978">Zjednodušené schéma, bez měřítka.</text>
  </g>
</svg>
