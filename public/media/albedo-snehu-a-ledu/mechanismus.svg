<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">Zpětná vazba sněhu a ledu</title><desc id="desc">Kvalitativní schéma. Při stejném osvitu světlá pokrývka odráží více než odkrytý tmavý povrch. Energie navíc může způsobit další tání. Šipky nejsou měřená množství.</desc><defs><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c68b29"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#277b78"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ba572f"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1100" height="660" rx="0" fill="#faf9f4"/><text x="34" y="46" font-size="29" fill="#233e43" font-weight="700" text-anchor="start">Méně světlé pokrývky, více pohlcené energie</text><text x="34" y="79" font-size="19" fill="#596c6c" font-weight="400" text-anchor="start">Porovnání při stejném dopadajícím záření a stejném stavu atmosféry</text><rect x="28" y="103" width="508" height="383" rx="12" fill="#edf4f2"/><rect x="564" y="103" width="508" height="383" rx="12" fill="#edf4f2"/><text x="50" y="137" font-size="23" fill="#233e43" font-weight="700" text-anchor="start">Sníh a led</text><text x="587" y="137" font-size="23" fill="#233e43" font-weight="700" text-anchor="start">Po ústupu pokrývky</text><text x="550" y="174" font-size="18" fill="#596c6c" font-weight="400" text-anchor="middle">Oblaka část povrchové změny zakrývají</text><circle cx="110" cy="227" r="24" fill="#edcb78"/><path d="M142 227L151 227" stroke="#c68b29" stroke-width="3"/><path d="M132.62741699796953 249.62741699796953L138.99137802864846 255.99137802864846" stroke="#c68b29" stroke-width="3"/><path d="M110 259L110 268" stroke="#c68b29" stroke-width="3"/><path d="M87.37258300203048 249.62741699796953L81.00862197135156 255.99137802864846" stroke="#c68b29" stroke-width="3"/><path d="M78 227L69 227" stroke="#c68b29" stroke-width="3"/><path d="M87.37258300203047 204.37258300203047L81.00862197135154 198.00862197135154" stroke="#c68b29" stroke-width="3"/><path d="M110 195L109.99999999999999 186" stroke="#c68b29" stroke-width="3"/><path d="M132.6274169979695 204.37258300203047L138.99137802864846 198.00862197135154" stroke="#c68b29" stroke-width="3"/><path d="M143 255 L250 373" fill="none" stroke="#c68b29" stroke-width="7" marker-end="url(#gold)" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="305" font-size="18" fill="#c68b29" font-weight="700" text-anchor="start">stejný osvit</text><path d="M28 386 Q143 371 250 386 T536 386 L536 486 L28 486Z" fill="#bfd7d9"/><circle cx="646" cy="227" r="24" fill="#edcb78"/><path d="M678 227L687 227" stroke="#c68b29" stroke-width="3"/><path d="M668.6274169979695 249.62741699796953L674.9913780286485 255.99137802864846" stroke="#c68b29" stroke-width="3"/><path d="M646 259L646 268" stroke="#c68b29" stroke-width="3"/><path d="M623.3725830020305 249.62741699796953L617.0086219713515 255.99137802864846" stroke="#c68b29" stroke-width="3"/><path d="M614 227L605 227" stroke="#c68b29" stroke-width="3"/><path d="M623.3725830020305 204.37258300203047L617.0086219713515 198.00862197135154" stroke="#c68b29" stroke-width="3"/><path d="M646 195L646 186" stroke="#c68b29" stroke-width="3"/><path d="M668.6274169979695 204.37258300203047L674.9913780286485 198.00862197135154" stroke="#c68b29" stroke-width="3"/><path d="M679 255 L786 373" fill="none" stroke="#c68b29" stroke-width="7" marker-end="url(#gold)" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="305" font-size="18" fill="#c68b29" font-weight="700" text-anchor="start">stejný osvit</text><path d="M564 386 Q679 371 786 386 T1072 386 L1072 486 L564 486Z" fill="#bfd7d9"/><path d="M28 376L100 368L169 375L245 363L310 370L370 363L445 374L536 369L536 419L28 419Z" fill="#fff" stroke="#b6ced0" stroke-width="2"/><text x="51" y="448" font-size="20" fill="#233e43" font-weight="700" text-anchor="start">světlá pokrývka</text><path d="M268 368 L366 241" fill="none" stroke="#277b78" stroke-width="7" marker-end="url(#teal)" stroke-linecap="round" stroke-linejoin="round"/><text x="325" y="211" font-size="20" fill="#277b78" font-weight="700" text-anchor="start">více odrazu</text><path d="M252 391 L252 460" fill="none" stroke="#ba572f" stroke-width="4" marker-end="url(#orange)" stroke-linecap="round" stroke-linejoin="round"/><text x="282" y="463" font-size="18" fill="#ba572f" font-weight="700" text-anchor="start">méně příjmu</text><path d="M564 377L600 370L641 377L685 373L701 387L680 405L630 400L564 411Z" fill="#fff" stroke="#b6ced0" stroke-width="2"/><path d="M804 368 L864 292" fill="none" stroke="#277b78" stroke-width="4" marker-end="url(#teal)" stroke-linecap="round" stroke-linejoin="round"/><text x="862" y="269" font-size="20" fill="#277b78" font-weight="700" text-anchor="start">méně odrazu</text><path d="M788 390 L788 459" fill="none" stroke="#ba572f" stroke-width="8" marker-end="url(#orange)" stroke-linecap="round" stroke-linejoin="round"/><text x="815" y="447" font-size="20" fill="#ba572f" font-weight="700" text-anchor="start">více příjmu</text><text x="587" y="470" font-size="17" fill="#233e43" font-weight="400" text-anchor="start">voda nebo tmavší půda</text><text x="34" y="523" font-size="22" fill="#233e43" font-weight="700" text-anchor="start">Zesilující vazba</text><rect x="34" y="544" width="284" height="54" rx="12" fill="#e5ede5"/><text x="176" y="577" font-size="20" fill="#233e43" font-weight="700" text-anchor="middle">Počáteční oteplení</text><rect x="407" y="544" width="284" height="54" rx="12" fill="#e5ede5"/><text x="549" y="577" font-size="20" fill="#233e43" font-weight="700" text-anchor="middle">Méně sněhu a ledu</text><rect x="780" y="544" width="286" height="54" rx="12" fill="#f2e3d1"/><text x="923" y="577" font-size="20" fill="#233e43" font-weight="700" text-anchor="middle">Více ohřevu či tání</text><path d="M331 571H393" fill="none" stroke="#277b78" stroke-width="4" marker-end="url(#teal)" stroke-linecap="round" stroke-linejoin="round"/><path d="M704 571H766" fill="none" stroke="#ba572f" stroke-width="4" marker-end="url(#orange)" stroke-linecap="round" stroke-linejoin="round"/><path d="M923 609V636H550V610" fill="none" stroke="#ba572f" stroke-width="3" marker-end="url(#orange)" stroke-linecap="round" stroke-linejoin="round"/><text x="310" y="640" font-size="17" fill="#ba572f" font-weight="400" text-anchor="start">další ústup</text></g></svg>
