<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">Dvanáct odhadů změny sluneční bilance</title><desc id="desc">Čtyři popisy atmosféry a tři kontrasty albeda dávají 0,26 až 0,72 W/m². Průměr 0,4475 W/m² se zaokrouhluje na 0,45. Jde o severní polokouli a změnu 1979–2008, nikoli globální trend za rok.</desc><defs><marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c68b29"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#277b78"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ba572f"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1100" height="660" rx="0" fill="#faf9f4"/><text x="34" y="46" font-size="29" fill="#233e43" font-weight="700" text-anchor="start">Stejné znaménko, rozdílná velikost</text><text x="34" y="80" font-size="20" fill="#596c6c" font-weight="400" text-anchor="start">Změna pohlceného slunečního záření • severní polokoule • 1979–2008</text><path d="M256 144V450" stroke="#d9dfd9" stroke-width="2"/><text x="256" y="480" font-size="18" fill="#596c6c" font-weight="400" text-anchor="middle">0,0</text><path d="M349.75 144V450" stroke="#d9dfd9" stroke-width="1"/><text x="349.75" y="480" font-size="18" fill="#596c6c" font-weight="400" text-anchor="middle">0,1</text><path d="M443.5 144V450" stroke="#d9dfd9" stroke-width="1"/><text x="443.5" y="480" font-size="18" fill="#596c6c" font-weight="400" text-anchor="middle">0,2</text><path d="M537.25 144V450" stroke="#d9dfd9" stroke-width="1"/><text x="537.25" y="480" font-size="18" fill="#596c6c" font-weight="400" text-anchor="middle">0,3</text><path d="M631 144V450" stroke="#d9dfd9" stroke-width="1"/><text x="631" y="480" font-size="18" fill="#596c6c" font-weight="400" text-anchor="middle">0,4</text><path d="M724.75 144V450" stroke="#d9dfd9" stroke-width="1"/><text x="724.75" y="480" font-size="18" fill="#596c6c" font-weight="400" text-anchor="middle">0,5</text><path d="M818.4999999999999 144V450" stroke="#d9dfd9" stroke-width="1"/><text x="818.4999999999999" y="480" font-size="18" fill="#596c6c" font-weight="400" text-anchor="middle">0,6</text><path d="M912.2499999999999 144V450" stroke="#d9dfd9" stroke-width="1"/><text x="912.2499999999999" y="480" font-size="18" fill="#596c6c" font-weight="400" text-anchor="middle">0,7</text><path d="M1006 144V450" stroke="#d9dfd9" stroke-width="1"/><text x="1006" y="480" font-size="18" fill="#596c6c" font-weight="400" text-anchor="middle">0,8</text><text x="631" y="516" font-size="20" fill="#233e43" font-weight="400" text-anchor="middle">Dodatečný příjem nad atmosférou (W/m²)</text><text x="34" y="189" font-size="23" fill="#233e43" font-weight="700" text-anchor="start">CAM3</text><text x="34" y="213" font-size="17" fill="#596c6c" font-weight="400" text-anchor="start">model atmosféry</text><path d="M499.75 185H706" stroke="#aebcb8" stroke-width="3"/><circle cx="499.75" cy="185" r="7" fill="#277b78"/><text x="499.75" y="167" font-size="18" fill="#277b78" font-weight="700" text-anchor="middle">0,26</text><rect x="605.25" y="178" width="14" height="14" rx="0" fill="#233e43"/><text x="612.25" y="167" font-size="18" fill="#233e43" font-weight="700" text-anchor="middle">0,38</text><path d="M706 176L715 192L697 192Z" fill="#ba572f"/><text x="706" y="167" font-size="18" fill="#ba572f" font-weight="700" text-anchor="middle">0,48</text><text x="34" y="266" font-size="23" fill="#233e43" font-weight="700" text-anchor="start">AM2</text><text x="34" y="290" font-size="17" fill="#596c6c" font-weight="400" text-anchor="start">model atmosféry</text><path d="M527.875 262H715.375" stroke="#aebcb8" 