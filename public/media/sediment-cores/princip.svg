<svg xmlns="http://www.w3.org/2000/svg" width="720" height="860" viewBox="0 0 720 860" role="img" aria-labelledby="title desc">
<title id="title">Společný sled vrstev</title><desc id="desc">Překrývající se úseky ze dvou vrtů sestaví úplnější sloupec. Stáří se určuje samostatně.</desc>
<rect width="720" height="860" fill="#f4f7f5"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#28696d" stroke-width="1.5"/></marker></defs>
<g font-family="Arial, sans-serif" fill="#173d40">
<text x="32" y="48" font-size="32" font-weight="bold">Společný sled vrstev</text>
<text x="32" y="88" font-size="25">Stejné barvy označují odpovídající vrstvy.</text>
<text x="120" y="138" text-anchor="middle" font-size="29" font-weight="bold">Vrt A</text>
<rect x="70" y="160" width="100" height="60" fill="#c5b28d" stroke="#d3dbd7"/>
<rect x="70" y="220" width="100" height="60" fill="#e3d8bf" stroke="#d3dbd7"/>
<rect x="70" y="280" width="100" height="60" fill="#fff" stroke="#d3dbd7"/>
<rect x="70" y="340" width="100" height="60" fill="#fff" stroke="#d3dbd7"/>
<rect x="70" y="400" width="100" height="60" fill="#d5c29d" stroke="#d3dbd7"/>
<rect x="70" y="460" width="100" height="60" fill="#b69c72" stroke="#d3dbd7"/>
<text x="335" y="138" text-anchor="middle" font-size="29" font-weight="bold">Vrt B</text>
<rect x="285" y="160" width="100" height="60" fill="#fff" stroke="#d3dbd7"/>
<rect x="285" y="220" width="100" height="60" fill="#fff" stroke="#d3dbd7"/>
<rect x="285" y="280" width="100" height="60" fill="#b3d1d8" stroke="#d3dbd7"/>
<rect x="285" y="340" width="100" height="60" fill="#85b0c0" stroke="#d3dbd7"/>
<rect x="285" y="400" width="100" height="60" fill="#fff" stroke="#d3dbd7"/>
<rect x="285" y="460" width="100" height="60" fill="#fff" stroke="#d3dbd7"/>
<text x="590" y="138" text-anchor="middle" font-size="29" font-weight="bold">Výběr</text>
<rect x="540" y="160" width="100" height="60" fill="#c5b28d" stroke="#d3dbd7"/>
<rect x="540" y="220" width="100" height="60" fill="#e3d8bf" stroke="#d3dbd7"/>
<rect x="540" y="280" width="100" height="60" fill="#b3d1d8" stroke="#d3dbd7"/>
<rect x="540" y="340" width="100" height="60" fill="#85b0c0" stroke="#d3dbd7"/>
<rect x="540" y="400" width="100" height="60" fill="#d5c29d" stroke="#d3dbd7"/>
<rect x="540" y="460" width="100" height="60" fill="#b69c72" stroke="#d3dbd7"/>
<rect x="65" y="160" width="110" height="120" fill="none" stroke="#28696d" stroke-width="4"/>
<rect x="280" y="280" width="110" height="120" fill="none" stroke="#28696d" stroke-width="4"/>
<rect x="65" y="400" width="110" height="120" fill="none" stroke="#28696d" stroke-width="4"/>
<path d="M180,220 H525" fill="none" stroke="#28696d" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M395,340 H525" fill="none" stroke="#28696d" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M180,460 H525" fill="none" stroke="#28696d" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="32" y="567" font-size="25">Zelený obrys: vybrané úseky.</text>
<text x="32" y="603" font-size="25">Bílá mezera: chybějící část odběru.</text>
<path d="M590,535 V654 H360 V683" fill="none" stroke="#28696d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="32" y="703" width="656" height="126" rx="10" fill="#e1ece8"/>
<text x="56" y="744" font-size="28" font-weight="bold">Samostatný krok: datování</text>
<text x="56" y="783" font-size="25">Opěrné body přiřadí hloubkám stáří.</text>
<text x="56" y="816" font-size="23">Schéma neznázorňuje skutečná data.</text>
</g></svg>
