<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">Pohyb ker není totéž co úbytek objemu</title><desc id="desc">Družice sleduje plochu a posun ker přes průliv. Sonar měří ponořenou část pro odhad tloušťky. Větší plocha tenčích ker může nést menší objem.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#397fa2"/></marker><marker id="heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cc713c"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="660" rx="0" fill="#f5f7f5" stroke="none" stroke-width="2"/><text x="32" y="43" font-size="28" fill="#233c46" font-weight="700"><tspan x="32" dy="0">Pohyb ker není totéž co úbytek objemu</tspan></text><rect x="28" y="70" width="510" height="530" rx="14" fill="#e1eef2" stroke="#c8d6db" stroke-width="2"/><rect x="558" y="70" width="514" height="530" rx="14" fill="#fff" stroke="#c8d6db" stroke-width="2"/><text x="48" y="109" font-size="23" fill="#233c46" font-weight="700"><tspan x="48" dy="0">1  Plocha a pohyb přes průliv</tspan></text><path d="M28 158 L115 152 L166 198 L132 252 L169 310 L139 382 L123 450 L28 485 Z" fill="#c9d4cb"/><path d="M538 175 L479 155 L462 211 L485 254 L459 296 L489 351 L538 363 Z" fill="#c9d4cb"/><text x="44" y="287" font-size="19" fill="#233c46" font-weight="400"><tspan x="44" dy="0">Grónsko</tspan></text><text x="453" y="392" font-size="18" fill="#233c46" font-weight="400"><tspan x="453" dy="0">Špicberky</tspan></text><text x="207" y="158" font-size="24" fill="#233c46" font-weight="700"><tspan x="207" dy="0">Arktida</tspan></text><g fill="#fff" stroke="#85a7b5" stroke-width="2"><path d="M209 190 L265 182 L282 215 L258 238 L211 227 Z"/><path d="M323 197 L377 186 L402 224 L370 250 L325 237 Z"/><path d="M201 306 L247 287 L277 315 L263 351 L214 350 Z"/><path d="M321 322 L361 303 L395 330 L377 360 L331 351 Z"/><path d="M238 454 L295 442 L317 478 L289 503 L246 491 Z"/></g><path d="M241 242 L241 283" stroke="#397fa2" stroke-width="5" fill="none" marker-end="url(#blue)"/><path d="M357 258 L357 300" stroke="#397fa2" stroke-width="5" fill="none" marker-end="url(#blue)"/><path d="M260 363 L260 438" stroke="#397fa2" stroke-width="5" fill="none" marker-end="url(#blue)"/><path d="M145 404 H443" stroke="#267c69" stroke-width="4" stroke-dasharray="10 6"/><text x="165" y="557" font-size="19" fill="#233c46" font-weight="400"><tspan x="165" dy="0">Sledujeme překročení měřicího řezu.</tspan></text><text x="44" y="585" font-size="20" fill="#267c69" font-weight="700"><tspan x="44" dy="0">Družice: posun ker + podíl ledu</tspan></text><text x="579" y="109" font-size="23" fill="#233c46" font-weight="700"><tspan x="579" dy="0">2  K ploše přidáme tloušťku</tspan></text><rect x="579" y="207" width="471" height="158" rx="0" fill="#e1eef2" stroke="none" stroke-width="2"/><rect x="635" y="198" width="280" height="74" rx="0" fill="#c6e1eb" stroke="#6595a8" stroke-width="2"/><path d="M579 207 H1050" stroke="#397fa2" stroke-width="2"/><text x="935" y="195" font-size="18" fill="#233c46" font-weight="400"><tspan x="935" dy="0">hladina</tspan></text><rect x="751" y="326" width="48" height="18" rx="5" fill="#267c69" stroke="none" stroke-width="2"/><path d="M775 327 L742 275 M775 327 L809 275" fill="none" stroke="#267c69" stroke-width="2" stroke-dasharray="5 4"/><text x="590" y="159" font-size="20" fill="#233c46" font-weight="400"><tspan x="590" dy="0">Sonar pod ledem měří ponor.</tspan></text><text x="842" y="316" font-size="18" fill="#267c69" font-weight="400"><tspan x="842" dy="0">odraz zvuku</tspan></text><text x="580" y="398" font-size="21" fill="#233c46" font-weight="700"><tspan x="580" dy="0">Samotná plocha ker nestačí</tspan></text><rect x="593" y="430" width="150" height="48" rx="0" fill="#c6e1eb" stroke="#6595a8" stroke-width="2"/><rect x="794" y="454" width="220" height="24" rx="0" fill="#c6e1eb" stroke="#6595a8" stroke-width="2"/><text x="589" y="511" font-size="19" fill="#233c46" font-weight="400"><tspan x="589" dy="0">menší plocha</tspan><tspan x="589" dy="25.650000000000002">silnější led</tspan></text><text x="797" y="511" font-size="19" fill="#233c46" font-weight="400"><tspan x="797" dy="0">větší plocha</tspan><tspan x="797" dy="25.650000000000002">tenčí led</tspan></text><text x="582" y="582" font-size="21" fill="#267c69" font-weight="700"><tspan x="582" dy="0">Objem závisí na ploše i tloušťce.</tspan></text><text x="32" y="636" font-size="18" fill="#60757a" font-weight="400"><tspan x="32" dy="0">Kvalitativní schéma • rozměry ani šipky nepředstavují měření</tspan></text></g></svg>