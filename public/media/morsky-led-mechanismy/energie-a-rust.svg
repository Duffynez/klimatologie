<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">Růst a tání závisejí na přenosu energie</title><desc id="desc">V zimě se teplo odvádí skrz sníh a led. V létě záření ohřívá vodu mezi krami a ta může tavit led zespodu. Bóje sledují povrchy a vnitřní teplotu.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#397fa2"/></marker><marker id="heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#cc713c"/></marker></defs><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1100" height="660" rx="0" fill="#f5f7f5" stroke="none" stroke-width="2"/><text x="32" y="43" font-size="28" fill="#233c46" font-weight="700"><tspan x="32" dy="0">Růst a tání závisejí na přenosu energie</tspan></text><rect x="28" y="70" width="510" height="530" rx="14" fill="#fff" stroke="#c8d6db" stroke-width="2"/><rect x="558" y="70" width="514" height="530" rx="14" fill="#fff" stroke="#c8d6db" stroke-width="2"/><text x="48" y="110" font-size="23" fill="#233c46" font-weight="700"><tspan x="48" dy="0">Zima • teplo odchází vzhůru</tspan></text><text x="578" y="110" font-size="23" fill="#233c46" font-weight="700"><tspan x="578" dy="0">Léto • voda přijímá záření</tspan></text><rect x="29" y="297" width="508" height="215" rx="0" fill="#dcecf1" stroke="none" stroke-width="2"/><rect x="64" y="288" width="437" height="75" rx="0" fill="#c6e1eb" stroke="#6595a8" stroke-width="2"/><rect x="64" y="266" width="437" height="22" rx="0" fill="#f6f7f5" stroke="#d6dfdf" stroke-width="2"/><text x="390" y="252" font-size="20" fill="#233c46" font-weight="400"><tspan x="390" dy="0">sníh</tspan></text><text x="90" y="324" font-size="23" fill="#233c46" font-weight="400"><tspan x="90" dy="0">led</tspan></text><text x="80" y="458" font-size="23" fill="#233c46" font-weight="400"><tspan x="80" dy="0">oceán</tspan></text><path d="M271 337 L271 164" stroke="#cc713c" stroke-width="5" fill="none" marker-end="url(#heat)"/><text x="70" y="155" font-size="20" fill="#233c46" font-weight="400"><tspan x="70" dy="0">Chladný vzduch</tspan></text><text x="307" y="206" font-size="20" fill="#a7532a" font-weight="400"><tspan x="307" dy="0">odvod</tspan><tspan x="307" dy="27">tepla</tspan></text><path d="M268 368 L268 412" stroke="#397fa2" stroke-width="5" fill="none" marker-end="url(#blue)"/><text x="305" y="401" font-size="20" fill="#397fa2" font-weight="400"><tspan x="305" dy="0">přírůstek</tspan><tspan x="305" dy="27">na spodku</tspan></text><path d="M446 467 L446 376" stroke="#cc713c" stroke-width="5" fill="none" marker-end="url(#heat)"/><text x="70" y="543" font-size="20" fill="#233c46" font-weight="400"><tspan x="70" dy="0">Růst nastane, když vedení odvede</tspan></text><text x="70" y="573" font-size="20" fill="#233c46" font-weight="400"><tspan x="70" dy="0">více tepla, než dodá voda.</tspan></text><rect x="559" y="307" width="512" height="205" rx="0" fill="#dcecf1" stroke="none" stroke-width="2"/><rect x="601" y="297" width="219" height="88" rx="0" fill="#c6e1eb" stroke="#6595a8" stroke-width="2"/><rect x="932" y="299" width="115" height="70" rx="0" fill="#c6e1eb" stroke="#6595a8" stroke-width="2"/><circle cx="872" cy="177" r="26" fill="#edb15e"/><path d="M870 216 L870 364" stroke="#cc713c" stroke-width="5" fill="none" marker-end="url(#heat)"/><text x="898" y="269" font-size="19" fill="#233c46" font-weight="400"><tspan x="898" dy="0">volná</tspan><tspan x="898" dy="25.650000000000002">voda</tspan></text><path d="M876 397 Q865 445 763 446 Q726 444 729 391" stroke="#cc713c" stroke-width="5" fill="none" marker-end="url(#heat)"/><text x="883" y="453" font-size="19" fill="#a7532a" font-weight="400"><tspan x="883" dy="0">teplo k ledu</tspan></text><rect x="658" y="232" width="18" height="200" rx="3" fill="#267c69" stroke="none" stroke-width="2"/><rect x="634" y="248" width="66" height="18" rx="5" fill="#267c69" stroke="none" stroke-width="2"/><g fill="#fff"><circle cx="667" cy="290" r="4"/><circle cx="667" cy="312" r="4"/><circle cx="667" cy="334" r="4"/><circle cx="667" cy="356" r="4"/><circle cx="667" cy="378" r="4"/></g><text x="585" y="177" font-size="21" fill="#267c69" font-weight="700"><tspan x="585" dy="0">bóje</tspan></text><path d="M628 184 L661 230" stroke="#267c69" stroke-width="2"/><text x="702" y="241" font-size="18" fill="#267c69" font-weight="400"><tspan x="702" dy="0">horní povrch</tspan></text><text x="584" y="485" font-size="19" fill="#267c69" font-weight="400"><tspan x="584" dy="0">spodní povrch a teplota uvnitř</tspan></text><path d="M785 383 L785 349" stroke="#397fa2" stroke-width="5" fill="none" marker-end="url(#blue)"/><text x="706" y="326" font-size="17" fill="#397fa2" font-weight="400"><tspan x="706" dy="0">ústup</tspan><tspan x="706" dy="22.950000000000003">spodku</tspan></text><text x="579" y="543" font-size="20" fill="#233c46" font-weight="400"><tspan x="579" dy="0">3  Bóje ověří místo a velikost tání.</tspan></text><text x="579" y="573" font-size="20" fill="#233c46" font-weight="400"><tspan x="579" dy="0">4  Družice a modely ověří dlouhý vývoj.</tspan></text><text x="32" y="636" font-size="18" fill="#60757a" font-weight="400"><tspan x="32" dy="0">Kvalitativní schéma • rozměry ani šipky nepředstavují měření</tspan></text></g></svg>