<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">Větší tání, ztenčování a ústup čela</title><desc id="desc">Energie taví povrch a voda odnáší hmotu. Po odtání sněhu tmavší led pohlcuje více slunečního záření. Přítok ledu dolů údolím nemusí nahradit místní ztrátu. Nové čelo leží výše než dřívější konec ledovce. Přerušovaná čára je starší obrys, nikoli naměřený profil.</desc>
<metadata>Klimatologie.eu, 6. listopadu 2026. Vlastní grafika vytvořená s pomocí AI, CC BY 4.0. Odborné podklady: podklady.txt.</metadata>
