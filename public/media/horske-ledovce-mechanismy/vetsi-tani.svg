<path d="M60 220 Q220 248 340 294 L435 331 Q275 293 60 247 Z" fill="#fffdf7" stroke="#d2e1de" stroke-width="1"/><path d="M60 198 Q220 216 340 266 Q505 323 650 370 Q804 414 1007 479" fill="none" stroke="#6d8382" stroke-width="3" stroke-dasharray="8 7"/><text x="67" y="365" font-size="21" fill="#173e3c" font-weight="700">Po odtání sněhu</text><text x="67" y="393" font-size="21" fill="#173e3c" font-weight="400">led pohltí více světla</text><path d="M293 369 L355 309" fill="none" stroke="#173e3c" stroke-width="4" marker-end="url(#a173e3c)"/><path d="M419 354 Q517 398 598 413" fill="none" stroke="#237569" stroke-width="4" marker-end="url(#a237569)"/><text x="361" y="475" font-size="21" fill="#237569" font-weight="700">Přítok ledu</text><text x="812" y="283" font-size="21" fill="#173e3c" font-weight="700">Starší obrys</text><path d="M861 299 L866 425" fill="none" stroke="#173e3c" stroke-width="4" marker-end="url(#a173e3c)"/><text x="734" y="497" font-size="21" fill="#173e3c" font-weight="700">Nové čelo</text><path d="M880 488 L921 470" fill="none" stroke="#173e3c" stroke-width="4" marker-end="url(#a173e3c)"/><path d="M937 473 Q987 476 1042 491" fill="none" stroke="#4f8da5" stroke-width="4" marker-end="url(#a4f8da5)"/><rect x="38" y="530" width="492" height="99" rx="8" fill="#fffdf7" stroke="#d7d9ce"/><text x="58" y="558" font-size="21" fill="#173e3c" font-weight="700">Měřitelný úbytek</text><text x="58" y="586" font-size="20" fill="#173e3c" font-weight="400">Energie → tání → odtok vody.</text><text x="58" y="611" font-size="20" fill="#173e3c" font-weight="400">Hmotnosti ubývá, pokud ztráty převáží.</text><rect x="570" y="530" width="492" height="99" rx="8" fill="#fffdf7" stroke="#d7d9ce"/><text x="590" y="558" font-size="21" fill="#173e3c" font-weight="700">Zpožděná změna délky</text><text x="590" y="586" font-size="20" fill="#173e3c" font-weight="400">Jazyk zaniká tam, kde přítok nestačí.</text><text x="590" y="611" font-size="20" fill="#173e3c" font-weight="400">Led při