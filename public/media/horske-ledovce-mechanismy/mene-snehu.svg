<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">Méně sněhu při stejné letní ztrátě</title><desc id="desc">Schéma řezu ledovcem ukazuje zimní přísun, přesun ledu dolů údolím a odtok vody. Menší přírůstek sněhu může zhoršit bilanci, i když letní ztráty zůstanou stejné. Sonda a měřicí tyč rozlišují obě části. Tvary nejsou v měřítku.</desc>
