<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc">
<title id="title">Rádiový zákryt a výpočet suché teploty</title>
<desc id="desc">Rádiový signál se při průchodu atmosférou ohýbá směrem k Zemi. Přijímač měří změnu fáze. Výpočet s využitím drah a hodin poskytne ohyb, refraktivitu a ve výpočtu pro suchý vzduch hustotu, tlak a teplotu.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#176c85" stroke-width="1.8"/></marker></defs>
<rect width="900" height="760" rx="18" fill="#f4f8f8"/>
<g font-family="Arial, sans-serif" fill="#183a45">
<text x="34" y="48" font-size="32" font-weight="bold">Signál prochází podél zemského okraje</text>
<path d="M55 405 Q450 -125 845 405 L845 433 L55 433Z" fill="#d9ebed"/>
<path d="M55 425 Q450 250 845 425 L845 433 L55 433Z" fill="#8bb1a7"/>
<text x="450" y="399" text-anchor="middle" font-size="29">Země</text>
<text x="66" y="346" font-size="27">atmosféra</text>
<text x="36" y="106" font-size="27">Navigační</text><text x="36" y="137" font-size="27">družice GNSS</text>
<g transform="translate(90 196)"><rect x="-12" y="-20" width="26" height="38" rx="3" fill="#b77c26"/><path d="M-49 -13H-16V12H-49ZM18 -13H51V12H18Z" fill="#355f83"/></g>
<text x="632" y="106" font-size="27">Družice s přijímačem</text><text x="632" y="137" font-size="27">na nízké dráze</text>
<g transform="translate(810 216)"><rect x="-12" y="-20" width="26" height="38" rx="3" fill="#b77c26"/><path d="M-49 -13H-16V12H-49ZM18 -13H51V12H18Z" fill="#355f83"/></g>
<path d="M142 195 Q450 132 758 210" fill="none" stroke="#176c85" stroke-width="5" marker-end="url(#arrow)"/>
<circle cx="450" cy="167.3" r="7" fill="#b77c26"/>
<path d="M450 178V332" stroke="#67777b" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M460 180L510 232" fill="none" stroke="#67777b" stroke-width="2"/>
<text x="520" y="253" font-size="26">nejnižší bod</text><text x="520" y="284" font-size="26">dráhy signálu</text>
<text x="34" y="478" font-size="30" font-weight="bold">Co se měří a co se z měření vypočítá</text>
<rect x="34" y="500" width="250" height="96" rx="10" fill="#176c85"/><text x="159" y="539" text-anchor="middle" font-size="27" fill="white">Změna fáze</text><text x="159" y="573" text-anchor="middle" font-size="23" fill="white">záznam přijímače</text>
<path d="M295 548H329" stroke="#176c85" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="345" y="500" width="200" height="96" rx="10" fill="#e3eeef"/><text x="445" y="539" text-anchor="middle" font-size="27">Ohyb signálu</text><text x="445" y="573" text-anchor="middle" font-size="23">dráhy a hodiny</text>
<path d="M557 548H591" stroke="#176c85" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="607" y="500" width="259" height="96" rx="10" fill="#e3eeef"/><text x="736" y="539" text-anchor="middle" font-size="27">Refraktivita</text><text x="736" y="573" text-anchor="middle" font-size="23">Abelova inverze</text>
<path d="M736 605V631" stroke="#176c85" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="34" y="645" width="832" height="81" rx="10" fill="#e6eee3"/><text x="450" y="678" text-anchor="middle" font-size="27">Suchý vzduch: hustota → tlak → teplota</text><text x="450" y="709" text-anchor="middle" font-size="23">Tlak vyjadřuje tíhu nadložního vzduchu na jednotku plochy.</text>
</g></svg>
